info:
  name: No Leídas
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/my/notifications/unread-count"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Contador de Notificaciones No Leídas

  Devuelve el total de notificaciones In-App no leídas del usuario autenticado para actualizar la insignia (badge) de la campana.

  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/my/notifications/unread-count`
  - **Método**: `GET`
  - **Filtros**: `auth:only_user`

  ## 📥 Respuestas (Responses)

  **✅ 200 OK**
  ```json
  {
    "status": 200,
    "data": {
      "unread": 3
    }
  }
  ```

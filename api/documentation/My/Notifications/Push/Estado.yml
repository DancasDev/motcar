  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Estado del Canal Push

  Consulta si el canal push está disponible a nivel global y si el usuario tiene dispositivos registrados y el canal activado.

  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/my/notifications/push/status`
  - **Método**: `GET`
  - **Filtros**: `auth:only_user`

  ## 📥 Respuestas (Responses)

  **✅ 200 OK**
  ```json
  {
    "status": 200,
    "data": {
      "status": "active",
      "active_devices": 1,
      "total_devices": 1,
      "max_devices": 5,
      "provider": "fcm"
    }
  }
  ```

info:
  name: Consultar
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/my/notifications/channels"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Consultar Canales de Notificación

  Obtiene la lista de canales de notificación configurables (Email: 1, Push: 2) junto con su disponibilidad y estado de habilitación para el usuario autenticado.

  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/my/notifications/channels`
  - **Método**: `GET`
  - **Filtros**: `auth:only_user`

  ## 📥 Respuestas (Responses)

  **✅ 200 OK**
  ```json
  {
    "status": 200,
    "data": [
      {
        "channel": "1",
        "available": true,
        "enabled": true,
        "channel_key": "admin@example.com"
      },
      {
        "channel": "2",
        "available": false,
        "enabled": false,
        "channel_key": null
      }
    ]
  }
  ```

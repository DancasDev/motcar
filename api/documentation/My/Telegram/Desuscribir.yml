info:
  name: Desvincular
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{base_url}}/v1/my/telegram/unsubscribe"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Desvincular Cuenta de Telegram

  Elimina la vinculación de Telegram del perfil del usuario autenticado.

  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/my/telegram/unsubscribe`
  - **Método**: `DELETE`
  - **Filtros**: `auth:only_user`

  ## 📥 Respuestas (Responses)

  **✅ 200 OK**
  ```json
  {
    "status": 200,
    "error": null,
    "messages": {
      "success": "Cuenta de Telegram desvinculada correctamente."
    }
  }
  ```

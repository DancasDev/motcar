info:
  name: Vincular
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/my/telegram/subscribe"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Iniciar Vinculación con Telegram

  Genera un token efímero y un enlace directo (deep-link) hacia el bot de Telegram para asociar la cuenta del usuario.

  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/my/telegram/subscribe`
  - **Método**: `GET`
  - **Filtros**: `auth:only_user`

  ## 📥 Respuestas (Responses)

  **✅ 200 OK**
  ```json
  {
    "status": 200,
    "data": {
      "token": "eyJhbGciOi...",
      "deep_link": "https://t.me/mi_bot?start=eyJhbGciOi...",
      "bot_username": "mi_bot",
      "expires_at": "2026-09-27 20:15:00",
      "ttl_seconds": 900
    }
  }
  ```

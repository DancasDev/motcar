docs: |-
  # Consultar Perfil Propio

  Devuelve la información de perfil del usuario autenticado.

  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/my/profile`
  - **Método**: `GET`
  - **Filtros**: `auth:module_code=my_profile,only_user`

  ## 📤 Datos de Solicitud (Request)

  ### Parámetros de Consulta (Query Params)
  `fields` (sintaxis del motor de consultas DQB).

  ### Campos Disponibles

  Nombre | Nivel | Acciones | Descripción
  --- | --- | --- | ---
  id | 0 | L | ID del registro.
  username | 0 | L | Nombre de acceso.
  email | 0 | L | Correo.
  first_name | 0 | L | Nombre(s).
  last_name | 0 | L | Apellido(s).
  sex | 0 | L | Sexo ("0" = Masculino, "1" = Femenino).
  photo_url | 0 | L | Foto de perfil.
  signature_url | 0 | L | Firma digital.
  country_id | 0 | L | ID del país.
  country_code | 0 | L | Código del país.
  country_name | 0 | L | Nombre del país.
  language_id | 0 | L | ID del idioma.
  language_code | 0 | L | Código del idioma.
  language_name | 0 | L | Nombre del idioma.
  time_zone_id | 0 | L | ID de la zona horaria.
  time_zone_code | 0 | L | Código de la zona horaria.
  force_to | 0 | L | Acciones forzadas.
  notification_channels | 0 | L | Canales de notificación habilitados.
  telegram_chat_id | 2 | L | ID del chat de Telegram (requiere nivel 2).
  telegram_username | 0 | L | Nombre de usuario en Telegram.
  metadata | 0 | L | Metadatos dinámicos.
  is_disabled | 0 | L | Estado (0: activo, 1: inhabilitado).
  created_at | 0 | L | Fecha de creación.
  updated_at | 0 | L | Fecha de modificación.
  deleted_at | 2 | L | Eliminación lógica (requiere nivel 2).

  > **Acciones:** `L`: Lectura (`fields`), `F`: Filtrado (`filters`), `O`: Ordenamiento (`order`), `G`: Agrupamiento (`groupBy`), `H`: Condición agregada (`having`).

  ## ⚙️ Reglas de Negocio
  1. Devuelve exclusivamente la información correspondiente al usuario autenticado.
  2. `password` nunca se expone.

  ## 📥 Respuestas (Responses)

  **✅ 200 OK (Éxito)**
  ```JSON
  {
    "data": {
      "id": "1",
      "username": "Admin123",
      "email": "admin@example.com",
      "first_name": "Admin",
      "last_name": null,
      "sex": null,
      "photo_url": null,
      "is_disabled": "0"
    },
    "in_trash": false
  }
  ```

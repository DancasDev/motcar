info:
  name: Confirmar
  type: http
  seq: 2

http:
  method: PUT
  url: "{{base_url}}/v1/system/services/email/verification"
  body:
    type: json
    data: |-
      {
        "verification_id": "{{verification_id}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Confirmar Verificación de Correo

  Valida el `verification_id` y marca el correo del usuario autenticado como verificado.

  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/system/services/email/verification`
  - **Método**: `PUT`
  - **Filtros**: `auth:only_user`, `otp:action=email_verification`

  ## 📤 Datos de Solicitud (Request)

  ### Body

  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  `verification_id` | `integer` | Requerido. | ID devuelto en el paso de solicitud.

  ## ⚙️ Reglas de Negocio
  1. El OTP debe pertenecer al usuario autenticado; si no → `400 OTP_USER_MISMATCH`.
  2. Tras confirmar, la fecha de verificación se actualiza y cualquier restricción por verificación de correo pendiente queda resuelta.

  ## 📥 Respuestas (Responses)

  **✅ 200 OK (Éxito)**
  ```JSON
  {
    "status": 200,
    "data": {
      "user_id": 1
    },
    "messages": {
      "success": "El correo electrónico ha sido verificado exitosamente."
    }
  }
  ```

  **❌ 400 OTP No Válido**
  ```JSON
  {
    "status": 400,
    "error": "OTP_RECORD_NOT_FOUND",
    "messages": {
      "error": "El código de verificación no existe."
    }
  }
  ```

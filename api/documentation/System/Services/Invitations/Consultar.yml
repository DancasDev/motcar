info:
  name: Consultar
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/system/services/invitations/setup"
  headers:
    - name: X-Action-Token
      value: "{{action_token}}"
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Consultar Datos de Onboarding (Setup)

  Consulta información pública del perfil del usuario (nombre, apellido, foto) mediante el token de invitación para renderizar la pantalla de bienvenida.

  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/system/services/invitations/setup`
  - **Método**: `GET`
  - **Filtros**: `action_token:action=user_invitation`

  ## 📥 Respuestas (Responses)

  **✅ 200 OK**
  ```json
  {
    "status": 200,
    "data": {
      "first_name": "Juan",
      "last_name": "Pérez",
      "photo_url": null
    }
  }
  ```

  **❌ 400 Token Inválido o Ausente**
  ```json
  {
    "status": 400,
    "error": "ACTION_TOKEN_REQUIRED",
    "messages": {
      "error": "Se requiere un token de acción válido."
    }
  }
  ```

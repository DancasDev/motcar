docs: |-
  # Actualizar Locker
  
  Modifica uno o varios locker existentes.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/system/storage/lockers/{{locker_id}}` (Individual) o `{{base_url}}/v1/system/storage/lockers` (Masivo)
  - **Método**: `PUT`
  - **Filtros**: `auth:module_code=stg_admin,only_user`
  - **Límite**: 1 (por lote)
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body
  
  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  name | string | Opcional. Máx: 255. | Nuevo nombre.
  allowed_mimes | string | Opcional. | MIME types.
  max_size | integer | Opcional. | Tamaño máximo.
  optimize_file | string | Opcional. Valores: "0", "1". | Optimizar imágenes al subir (se puede activar/desactivar en cualquier momento).
  is_disabled | string | Opcional. Valores: "0", "1". | Estado (0: activo, 1: inhabilitado).

  **Ejemplo Individual:**
  ```JSON
  {
    "name": "Fotos",
    "allowed_mimes": "image/*",
    "max_size": 4096,
    "optimize_file": "1"
  }
  ```
  
  **Ejemplo Masivo (vía `/v1/system/storage/lockers`, sin id en la URL):**
  ```JSON
  [
    {
      "id": 10,
      "name": "Fotos"
    },
    {
      "id": 11,
      "name": "Fotos"
    }
  ]
  ```
  
  ## ⚙️ Reglas de Negocio
  1. La clave identificadora (`locker_key`) es inmutable; solo se permite modificar `name`, `description`, `is_private` e `is_disabled`.
  2. **Actualización parcial:** solo se modifican los campos enviados en el cuerpo de la petición.
  3. **Actualización masiva:** se habilita cuando no se envía identificador en la URL; cada objeto en el array debe incluir su `id`.
  4. Si la petición no incluye ningún campo modificable → `400 UPDATE_EMPTY_ITEM`.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Éxito Individual)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 10,
      "affected": true
    },
    "messages": {
      "success": "Registro actualizado exitosamente."
    }
  }
  ```
  
  **✅ 200 OK (Registro no afectado)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 999,
      "affected": false
    },
    "messages": {
      "success": "No se realizaron cambios porque los datos ya estaban actualizados."
    }
  }
  ```
  
  **✅ 207 Multi-Status (Éxito/Error Masivo)**
  ```JSON
  {
    "status": 207,
    "data": [
      {
        "status": 200,
        "data": {
          "id": 10,
          "affected": true
        },
        "messages": {
          "success": "Registro actualizado exitosamente."
        }
      },
      {
        "status": 400,
        "error": "FAIL_VALIDATION",
        "messages": {
          "name": "El campo debe contener un valor único."
        }
      }
    ],
    "limit": 100,
    "affected": 1
  }
  ```
  
  **❌ 400 Fail Validation**
  ```JSON
  {
    "status": 400,
    "error": "FAIL_VALIDATION",
    "messages": {
      "name": "El campo es obligatorio."
    }
  }
  ```

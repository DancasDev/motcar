http:
  method: GET
  url: "{{base_url}}/v1/system/storage/lockers/{{locker_id}}/files"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Listar Archivos de un Locker

  Lista los archivos almacenados dentro de un locker.

  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/system/storage/lockers/{{locker_id}}/files`
  - **Método**: `GET`
  - **Filtros**: `auth:module_code=stg_admin`

  ## 📤 Datos de Solicitud (Request)

  ### Parámetros de Ruta (Path Params)
  Nombre | Tipo | Descripción
  --- | --- | ---
  `locker_id` | `integer` | ID del locker.

  ## ⚙️ Reglas de Negocio
  1. Si el locker no existe o está inhabilitado → `404 STORAGE_LOCKER_NOT_FOUND`.
  2. Los archivos ocultos (`.` inicial) se omiten.

  ## 📥 Respuestas (Responses)

  **✅ 200 OK (Éxito)**
  ```JSON
  [
    {
      "path": "images/profile-pics/avatar.jpg",
      "url": "http://127.0.0.1:8080/storage/images/profile-pics/avatar.jpg",
      "size": 20480,
      "mime_type": "image/jpeg",
      "last_modified": 1785570768
    }
  ]
  ```

  **❌ 404 Locker No Encontrado**
  ```JSON
  {
    "status": 404,
    "error": "STORAGE_LOCKER_NOT_FOUND",
    "messages": {
      "error": "El locker \"images/profile-pics\" no se encuentra."
    }
  }
  ```

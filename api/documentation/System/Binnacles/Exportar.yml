info:
  name: Exportar
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/v1/system/binnacles/export/xlsx"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Exportar Bitácoras

  Exporta las bitácoras a un archivo. Aplica la misma consulta dinámica del listado (filtros, orden, campos) y respeta el tope de 10000 registros por exportación.

  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/system/binnacles/export/{formato}`
  - **Método**: `GET`
  - **Filtros**: `auth:module_code=sys_binnacles`
  - **Límite**: 10000

  ### Formatos Soportados
  Formato | Extensión | MIME Type
  --- | --- | ---
  Excel | `xlsx` | `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`
  Excel 97 | `xls` | `application/vnd.ms-excel`
  OpenDocument | `ods` | `application/vnd.oasis.opendocument.spreadsheet`
  CSV | `csv` | `text/csv`
  PDF | `pdf` | `application/pdf`

  ## 📤 Datos de Solicitud (Request)

  ### Parámetros de Consulta (Query Params)
  Nombre | Tipo | Descripción
  --- | --- | ---
  `fields` | `string` | Campos a exportar.
  `filters` | `json` | Filtros dinámicos.
  `order` | `json` | Ordenamiento.
  `headers` | `json` | Mapeo de campos a encabezados personalizados (ej: `{"action":"Acción"}`).

  ### Ejemplos de URL
  ```bash
  # Exportar todo a Excel
  {{base_url}}/v1/system/binnacles/export/xlsx

  # Exportar a CSV con filtro por acción
  {{base_url}}/v1/system/binnacles/export/csv?filters=[["action","login"]]

  # Exportar a PDF con encabezados personalizados
  {{base_url}}/v1/system/binnacles/export/pdf?headers={"action":"Accion","date":"Fecha"}
  ```

  ### Columnas por Defecto
  `id`, `date`, `from_entity_type`, `from_entity_id`, `to_entity_type`, `to_entity_id`, `action`, `ip`, `data`, `session_id`, `description`.

  ## ⚙️ Reglas de Negocio
  1. Se exportan hasta **10000** registros (límite del endpoint).
  2. Con 0 resultados se genera el archivo igualmente (solo encabezados).
  3. Permite la descarga directa del archivo generado con la estructura solicitada.

  ## 📥 Respuestas (Responses)

  **✅ 200 OK (Descarga de Archivo)**
  La respuesta incluye `Content-Type` y `Content-Disposition: attachment` para la descarga del archivo.

  **❌ 400 Formato No Permitido**
  ```JSON
  {
    "status": 400,
    "error": "EXPORT_FORMAT_NOT_ALLOWED",
    "messages": {
      "error": "El formato \"txt\" no está permitido. Formatos válidos: csv, xlsx, xls, ods, pdf."
    }
  }
  ```

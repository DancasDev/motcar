info:
  name: Telegram
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/v1/system/webhooks/telegram"
  headers:
    - name: X-Telegram-Bot-Api-Secret-Token
      value: "{{telegram_webhook_secret}}"
  body:
    type: json
    data: |-
      {
        "update_id": 10000,
        "message": {
          "message_id": 1,
          "from": {
            "id": 123456789,
            "is_bot": false,
            "first_name": "User"
          },
          "chat": {
            "id": 123456789,
            "type": "private"
          },
          "date": 1790497911,
          "text": "/start"
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Telegram

  Recibe las actualizaciones y comandos enviados por la API de Telegram al chatbot del sistema. Requiere validación del token secreto mediante el header `X-Telegram-Bot-Api-Secret-Token`.

  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/system/webhooks/telegram`
  - **Método**: `POST`
  - **Filtros**: ninguno (público con validación de cabecera de secreto criptográfico)

  ## 📥 Respuestas (Responses)

  **✅ 200 OK**
  ```json
  {
    "status": 200,
    "data": []
  }
  ```

info:
  name: Consultar
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/system/metadata/fields/rules"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const d = res.getBody()?.data;
          const id = Array.isArray(d) ? d[0]?.id : d?.id;
          if (id) bru.setEnvVar("rule_id", String(id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Consultar Reglas de Validación

  Recupera una regla de validación individual o un listado paginado y filtrado del catálogo global. Usa el motor de consultas.

  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/system/metadata/fields/rules` (Lista) o `{{base_url}}/v1/system/metadata/fields/rules/{{rule_id}}` (Individual)
  - **Método**: `GET`
  - **Filtros**: `auth` (compartido: usuario o cliente autenticado).
  - **Límite**: por defecto

  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.

  ## 📤 Datos de Solicitud (Request)

  ### Parámetros de Consulta (Query Params)
  Use la sintaxis del motor de consultas (ver documentación general): `fields`, `filters`, `order`, `page`, `itemsPerPage`, `groupBy`, `having`.

  ### Campos Disponibles

  Nombre | Nivel | Acciones | Descripción
  --- | --- | --- | ---
  id | 0 | L, F, O | ID del tipo de validación.
  code | 0 | L, F, O | Código de la regla (ej: `required`, `max_length`, `regex_match`, `in_list`).
  parameters_schema | 0 | L | Esquema JSON de los parámetros requeridos por la regla.
  rule_template | 0 | L | Plantilla CI4 con placeholders `{param}` (ej: `max_length[{value}]`).
  name | 0 | L | **Calculado.** Nombre de la regla según `Accept-Language`.
  description | 0 | L | **Calculado.** Descripción de la regla según `Accept-Language`.
  is_disabled | 0 | L, F, O | Estado (0: activo, 1: inhabilitado).
  created_at | 0 | L, F, O | Fecha de creación.
  updated_at | 0 | L, F, O | Fecha de modificación.
  deleted_at | 2 | L, F, O | Eliminación lógica (requiere nivel 2).

  > **Acciones:** `L`: Lectura (`fields`), `F`: Filtrado (`filters`), `O`: Ordenamiento (`order`), `G`: Agrupamiento (`groupBy`), `H`: Condición agregada (`having`).

  ## ⚙️ Reglas de Negocio
  1. **Solo lectura:** no existen operaciones de escritura para el catálogo.
  2. `name` y `description` son campos calculados que se traducen según `Accept-Language`.
  3. `parameters_schema` y `rule_template` se usan para validar la configuración de reglas en los campos de certificación.
  4. `deleted_at` exige nivel de acceso 2 y header `In-Trash: true`.

  ## 📥 Respuestas (Responses)

  **✅ 200 OK (Listado)**
  ```JSON
  {
    "data": [
      { "id": "1", "code": "required", "name": "Obligatorio", "is_disabled": "0" },
      { "id": "2", "code": "max_length", "name": "Longitud máxima", "is_disabled": "0" }
    ],
    "count": 2,
    "limit": 25,
    "in_trash": false
  }
  ```

  **✅ 200 OK (Individual)**
  ```JSON
  {
    "data": { "id": "1", "code": "required", "name": "Obligatorio", "is_disabled": "0" },
    "in_trash": false
  }
  ```

  **❌ 404 Registro No Encontrado**
  ```JSON
  {
    "status": 404,
    "error": "RECORD_NOT_FOUND",
    "messages": {
      "error": "El recurso solicitado no fue encontrado."
    }
  }
  ```

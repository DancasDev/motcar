info:
  name: Actualizar
  type: http
  seq: 3

http:
  method: PUT
  url: "{{base_url}}/v1/system/metadata/{{metadata_schema_id}}"
  body:
    type: json
    data: |-
      {
        "unique_keys": [["field_a", "field_b"]]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Actualizar Claves Únicas Compuestas

  Permite configurar o limpiar las combinaciones de campos de metadatos que deben ser globalmente únicas para la entidad.

  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/system/metadata/{{metadata_schema_id}}` (Individual) o `{{base_url}}/v1/system/metadata` (Masivo)
  - **Método**: `PUT`
  - **Filtros**: `auth:module_code=sys_metadata,only_user`
  - **Límite**: por defecto

  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.

  ## 📤 Datos de Solicitud (Request)

  ### Body

  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  unique_keys | array | Opcional. Array de arrays de strings. | Grupos de campos que deben ser únicos en conjunto.
  is_disabled | string | Opcional. Valores: "0", "1". | Estado (0: activo, 1: inhabilitado).

  **Ejemplo Individual:**
  ```JSON
  {
    "unique_keys": [["field_a", "field_b"]]
  }
  ```

  **Ejemplo Masivo (vía `/v1/system/metadata`, sin id en la URL):**
  ```JSON
  [
    {
      "id": 1,
      "unique_keys": [["field_a", "field_b"]]
    }
  ]
  ```

  ## ⚙️ Reglas de Negocio
  1. `code`, `table_name` y `storage_column` son inmutables y no se pueden modificar.
  2. Los campos definidos en `unique_keys` deben existir como campos de metadatos del esquema.
  3. **Actualización masiva:** se deduce por la ausencia de id en la URL; cada ítem debe incluir su `id`.

  ## 📥 Respuestas (Responses)

  **✅ 200 OK (Éxito Individual)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 1,
      "affected": true
    },
    "messages": {
      "success": "Registro actualizado exitosamente."
    }
  }
  ```

  **✅ 207 Multi-Status (Éxito/Error Masivo)**
  ```JSON
  {
    "status": 207,
    "data": [
      {
        "status": 200,
        "data": {
          "id": 1,
          "affected": true
        },
        "messages": {
          "success": "Registro actualizado exitosamente."
        }
      }
    ],
    "limit": 100,
    "affected": 1
  }
  ```

  **❌ 400 Fail Validation**
  ```JSON
  {
    "status": 400,
    "error": "FAIL_VALIDATION",
    "messages": {
      "unique_keys": "El formato de unique_keys es inválido."
    }
  }
  ```

info:
  name: Consultar
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/system/metadata"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Consultar Esquemas de Metadatos

  Lista o consulta un esquema de metadatos dinámicos registrado en el sistema.

  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/system/metadata` (Lista) o `{{base_url}}/v1/system/metadata/{{metadata_schema_id}}` (Individual)
  - **Método**: `GET`
  - **Filtros**: `auth`
  - **Límite**: Por defecto (25 por página, máx 255)

  ## 📤 Datos de Solicitud (Request)

  ### Parámetros de Consulta (Query Params)
  Use la sintaxis del motor de consultas: `fields`, `filters`, `order`, `page`, `itemsPerPage`, `groupBy`, `having`.

  ### Campos Disponibles

  Nombre | Nivel | Acciones | Descripción
  --- | --- | --- | ---
  id | 0 | L, F, O | ID del esquema de metadatos.
  code | 0 | L, F, O | Código identificador del esquema de metadatos.
  table_name | 0 | L, F, O | Nombre de la entidad base vinculada.
  storage_column | 0 | L, F, O | Atributo de almacenamiento de metadatos en la entidad.
  unique_keys | 0 | L, F, O | Definición de claves únicas compuestas.
  is_disabled | 0 | L, F, O | Estado (0: activo, 1: inhabilitado).
  created_at | 0 | L, F, O | Fecha de creación.
  updated_at | 0 | L, F, O | Fecha de modificación.
  deleted_at | 2 | L, F, O | Eliminación lógica (requiere nivel 2).

  > **Acciones:** `L`: Lectura (`fields`), `F`: Filtrado (`filters`), `O`: Ordenamiento (`order`), `G`: Agrupamiento (`groupBy`), `H`: Condición agregada (`having`).

  ## 📥 Respuestas (Responses)

  **✅ 200 OK**
  ```json
  {
    "data": [
      {
        "id": "1",
        "code": "gac_user",
        "table_name": "gac_user",
        "storage_column": "metadata",
        "unique_keys": null,
        "is_disabled": "0",
        "created_at": "2026-09-27 07:19:50",
        "updated_at": "2026-09-27 07:36:35"
      }
    ],
    "count": 1,
    "limit": 255,
    "in_trash": false
  }
  ```

http:
  method: DELETE
  url: "{{base_url}}/v1/system/metadata/{{metadata_schema_id}}/groups/{{group_id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Eliminar Grupo de Metadatos

  Mueve uno o varios grupos a la papelera (soft delete) o los elimina permanentemente con el header `In-Trash: true`.

  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/system/metadata/{{metadata_schema_id}}/groups/{{group_id}}` (Individual) o `{{base_url}}/v1/system/metadata/{{metadata_schema_id}}/groups` (Masivo)
  - **Método**: `DELETE`
  - **Filtros**: `auth:module_code=sys_metadata,only_user`
  - **Límite**: por defecto

  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.

  ## 📤 Datos de Solicitud (Request)

  ### Body

  **Ejemplo Masivo (vía `/v1/system/metadata/{{metadata_schema_id}}/groups`, sin id en la URL):**
  ```JSON
  [
    {
      "id": 1
    },
    {
      "id": 2
    }
  ]
  ```

  ## ⚙️ Reglas de Negocio
  1. **Soft delete:** registra `deleted_at`; el grupo deja de aparecer en consultas activas.
  2. **Eliminación masiva:** se deduce por la ausencia de id en la URL; cada ítem debe incluir su `id`.
  3. Cada eliminación exitosa purga la caché del esquema (`purgeCache`).

  ## 📥 Respuestas (Responses)

  **✅ 200 OK (Eliminado)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 1,
      "affected": true
    },
    "messages": {
      "success": "Registro eliminado exitosamente."
    }
  }
  ```

  **✅ 200 OK (No existía / no afectado)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 999,
      "affected": false
    },
    "messages": {
      "success": "No se realizaron cambios porque los datos ya estaban actualizados."
    }
  }
  ```

  **✅ 207 Multi-Status (Éxito/Error Masivo)**
  ```JSON
  {
    "status": 207,
    "data": [
      {
        "status": 200,
        "data": {
          "id": 1,
          "affected": true
        },
        "messages": {
          "success": "Registro eliminado exitosamente."
        }
      }
    ],
    "limit": 100,
    "affected": 1
  }
  ```

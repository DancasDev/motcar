docs: |-
  # Actualizar Permiso de Rol

  Modifica uno o varios permisos de rol existentes.

  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/access/roles/{{role_id}}/permissions/{{permission_id}}` (Individual) o `{{base_url}}/v1/access/roles/{{role_id}}/permissions` (Masivo)
  - **Método**: `PUT`
  - **Filtros**: `auth:module_code=acc_role_permissions,only_user`
  - **Límite**: por defecto

  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.

  ## 📤 Datos de Solicitud (Request)

  ### Body

  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  feature | integer | Opcional. | Bitmask de características.
  scope_path | string | Opcional. Por defecto `*`. Ruta jerárquica de sucursales (ej: `1`, `1/2`, `1/*`) que debe ser válida y existente. | Alcance del permiso.
  level | string | Opcional. Valores: "0","1","2". | Nivel.
  payload | object | Opcional. Se valida contra el `payload_schema` del módulo actual del permiso; si el módulo no tiene esquema, el valor se ignora y queda `null`. | Carga útil.
  is_disabled | string | Opcional. Valores: "0", "1". | Estado (0: activo, 1: inhabilitado).

  **Ejemplo Individual:**
  ```JSON
  {
    "feature": 15,
    "level": "2",
    "payload": {
      "lck_ids": [1, 3]
    },
    "is_disabled": "0"
  }
  ```

  **Ejemplo Masivo (vía `/v1/access/roles/{{role_id}}/permissions`, sin id en la URL):**
  ```JSON
  [
    {
      "id": 10,
      "feature": 15
    },
    {
      "id": 11,
      "feature": 7
    }
  ]
  ```

  ## ⚙️ Reglas de Negocio
  1. El módulo y la asignación al rol no son modificables tras la creación; solo se pueden editar los campos permitidos (`feature`, `level`, `payload`, `scope_path`, `is_disabled`).
  2. **Actualización parcial:** solo se modifican los campos enviados en el cuerpo de la petición.
  3. **Actualización masiva:** se habilita cuando no se envía identificador en la URL; cada objeto en el array debe incluir su `id`.
  4. Si se incluye `payload`, se valida contra el esquema de configuración del módulo asignado.
  5. Si la petición no incluye ningún campo modificable → `400 UPDATE_EMPTY_ITEM`.

  ## 📥 Respuestas (Responses)

  **✅ 200 OK (Éxito Individual)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 10,
      "affected": true
    },
    "messages": {
      "success": "Registro actualizado exitosamente."
    }
  }
  ```

  **✅ 200 OK (Registro no afectado)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 999,
      "affected": false
    },
    "messages": {
      "success": "No se realizaron cambios porque los datos ya estaban actualizados."
    }
  }
  ```

  **✅ 207 Multi-Status (Éxito/Error Masivo)**
  ```JSON
  {
    "status": 207,
    "data": [
      {
        "status": 200,
        "data": {
          "id": 10,
          "affected": true
        },
        "messages": {
          "success": "Registro actualizado exitosamente."
        }
      },
      {
        "status": 400,
        "error": "FAIL_VALIDATION",
        "messages": {
          "payload": "El campo debe ser un array."
        }
      }
    ],
    "limit": 100,
    "affected": 1
  }
  ```

  **❌ 400 Fail Validation**
  ```JSON
  {
    "status": 400,
    "error": "FAIL_VALIDATION",
    "messages": {
      "feature": "El campo es obligatorio."
    }
  }
  ```

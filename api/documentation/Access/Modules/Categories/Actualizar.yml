info:
  name: Actualizar
  type: http
  seq: 2

http:
  method: PUT
  url: "{{base_url}}/v1/access/modules/categories/{{module_category_id}}"
  body:
    type: json
    data: |-
      {
        "scope": "ok",
        "is_disabled": "0"
      }

  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Actualizar Categoría de Módulo
  
  Modifica una o varias categorías de módulos existentes.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/access/modules/categories/{{module_category_id}}` (Individual) o `{{base_url}}/v1/access/modules/categories` (Masivo)
  - **Método**: `PUT`
  - **Filtros**: `auth:module_code=acc_modules`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body
  
  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  scope | string | Opcional. Máx: 3. | Alcance.
  is_disabled | string | Opcional. Valores: "0", "1". | Estado (0: activo, 1: inhabilitado).
  
  **Ejemplo Individual:**
  ```JSON
  {
    "scope": "ok",
    "is_disabled": "0"
  }
  ```
  
  **Ejemplo Masivo (vía `/v1/access/modules/categories`, sin id en la URL):**
  ```JSON
  [
    {
      "id": 10,
      "scope": "ok"
    },
    {
      "id": 11,
      "scope": "ok"
    }
  ]
  ```
  
  ## ⚙️ Reglas de Negocio
  1. El código de la categoría no es editable; solo se permite modificar `scope` e `is_disabled`.
  2. **Actualización parcial:** solo se modifican los campos enviados en el cuerpo de la petición.
  3. **Actualización masiva:** se habilita cuando no se envía identificador en la URL; cada objeto en el array debe incluir su `id`.
  4. Si la petición no incluye ningún campo modificable → `400 UPDATE_EMPTY_ITEM`.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Éxito Individual)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 10,
      "affected": true
    },
    "messages": {
      "success": "Registro actualizado exitosamente."
    }
  }
  ```
  
  **✅ 200 OK (Registro no afectado)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 999,
      "affected": false
    },
    "messages": {
      "success": "No se realizaron cambios porque los datos ya estaban actualizados."
    }
  }
  ```
  
  **✅ 207 Multi-Status (Éxito/Error Masivo)**
  ```JSON
  {
    "status": 207,
    "data": [
      {
        "status": 200,
        "data": {
          "id": 10,
          "affected": true
        },
        "messages": {
          "success": "Registro actualizado exitosamente."
        }
      },
      {
        "status": 400,
        "error": "FAIL_VALIDATION",
        "messages": {
          "scope": "El campo debe contener un valor único."
        }
      }
    ],
    "limit": 100,
    "affected": 1
  }
  ```
  
  **❌ 400 Fail Validation**
  ```JSON
  {
    "status": 400,
    "error": "FAIL_VALIDATION",
    "messages": {
      "scope": "El campo es obligatorio."
    }
  }
  ```

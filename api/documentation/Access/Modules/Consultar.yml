info:
  name: Consultar
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/access/modules"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const d = res.getBody()?.data;
          const id = Array.isArray(d) ? d[0]?.id : d?.id;
          if (id) bru.setEnvVar("module_id", String(id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Consultar Módulo
  
  Recupera un módulo individual o un listado paginado y filtrado. Usa el motor de consultas.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/access/modules` (Lista) o `{{base_url}}/v1/access/modules/{{module_id}}` (Individual)
  - **Método**: `GET`
  - **Filtros**: `auth:module_code=acc_modules`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Parámetros de Consulta (Query Params)
  Use la sintaxis del motor de consultas (ver documentación general): `fields`, `filters`, `order`, `page`, `itemsPerPage`, `groupBy`, `having`.
  
  
  ### Campos Disponibles

  Nombre | Nivel | Acciones | Descripción
  --- | --- | --- | ---
  id | 0 | L, F, O | ID del registro.
  module_category_id | 0 | L, F, O | Categoría.
  module_category_code | 0 | L, F, O | Código de categoría.
  code | 0 | L, F, O | Código del módulo.
  scope | 0 | L, F, O | Alcance.
  is_developing | 0 | L, F, O | En desarrollo.
  is_disabled | 0 | L, F, O | Estado.
  name | 0 | L, F, O | Nombre (calculado, según idioma).
  description | 0 | L, F, O | Descripción (calculada).
  created_at | 0 | L, F, O | Fecha de creación.
  updated_at | 0 | L, F, O | Fecha de modificación.
  deleted_at | 2 | L, F, O | Eliminación lógica (requiere nivel 2).
  
  > **Acciones:** `L`: Lectura (`fields`), `F`: Filtrado (`filters`), `O`: Ordenamiento (`order`), `G`: Agrupamiento (`groupBy`), `H`: Condición agregada (`having`).
  
  ## ⚙️ Reglas de Negocio
  1. Catálogo maestro de módulos del sistema para la configuración de permisos y navegación.
  2. Los campos `name` y `description` se entregan traducidos según la cabecera `Accept-Language` o el idioma predeterminado de la plataforma.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Listado)**
  ```JSON
  {
    "data": [
      {
        "id": 1,
        "code": "users",
        "name": "Usuarios"
      }
    ],
    "count": 1,
    "limit": 25,
    "in_trash": false
  }
  ```
  
  **✅ 200 OK (Individual)**
  ```JSON
  {
    "data": {
      "id": 1,
      "code": "users",
      "name": "Usuarios"
    },
    "in_trash": false
  }
  ```
  
  **❌ 404 Registro No Encontrado**
  ```JSON
  {
    "status": 404,
    "error": "RECORD_NOT_FOUND",
    "messages": {
      "error": "El recurso solicitado no fue encontrado."
    }
  }
  ```

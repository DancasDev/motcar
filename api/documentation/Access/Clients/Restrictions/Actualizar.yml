http:
  method: PUT
  url: "{{base_url}}/v1/access/clients/{{client_id}}/restrictions/{{restriction_id}}"
  body:
    type: json
    data: |-
      {
        "config": {
          "list": [
            "192.168.0.0/16"
          ]
        },
        "is_disabled": "0"
      }

  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Actualizar Restricción de Cliente
  
  Modifica una o varias restricciones de cliente existentes.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/access/clients/{{client_id}}/restrictions/{{restriction_id}}` (Individual) o `{{base_url}}/v1/access/clients/{{client_id}}/restrictions` (Masivo)
  - **Método**: `PUT`
  - **Filtros**: `auth:module_code=acc_client_permissions,only_user`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body
  
  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  config | object | Requerido. Según tipo/regla (ver documentación general). | Nueva configuración.
  scope_path | string | Opcional. Por defecto `*`. Ruta jerárquica de sucursales (ej: `1`, `1/2`, `1/*`) que debe ser válida y existente. | Alcance del permiso.
  is_disabled | string | Opcional. Valores: "0", "1". | Estado (0: activo, 1: inhabilitado).
  
  **Ejemplo Individual:**
  ```JSON
  {
    "config": {
      "list": [
        "192.168.0.0/16"
      ]
    },
    "is_disabled": "0"
  }
  ```
  
  **Ejemplo Masivo (vía `/v1/access/clients/{{client_id}}/restrictions`, sin id en la URL):**
  ```JSON
  [
    {
      "id": 10,
      "config": {
        "list": [
          "192.168.0.0/16"
        ]
      }
    },
    {
      "id": 11,
      "config": {
        "list": [
          "192.168.0.0/16"
        ]
      }
    }
  ]
  ```
  
  ## ⚙️ Reglas de Negocio
  1. El tipo (`type`), la regla (`rule`) y la vinculación al cliente no son modificables tras la creación; solo se pueden editar `config`, `scope_path` e `is_disabled`.
  2. **Actualización parcial:** solo se modifican los campos enviados en el cuerpo de la petición.
  3. **Actualización masiva:** se habilita cuando no se envía identificador en la URL; cada objeto en el array debe incluir su `id`.
  4. El objeto `config` se valida estrictamente según la combinación de tipo y regla del registro existente.
  5. Si la petición no incluye ningún campo modificable → `400 UPDATE_EMPTY_ITEM`.

  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Éxito Individual)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 10,
      "affected": true
    },
    "messages": {
      "success": "Registro actualizado exitosamente."
    }
  }
  ```
  
  **✅ 200 OK (Registro no afectado)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 999,
      "affected": false
    },
    "messages": {
      "success": "No se realizaron cambios porque los datos ya estaban actualizados."
    }
  }
  ```
  
  **✅ 207 Multi-Status (Éxito/Error Masivo)**
  ```JSON
  {
    "status": 207,
    "data": [
      {
        "status": 200,
        "data": {
          "id": 10,
          "affected": true
        },
        "messages": {
          "success": "Registro actualizado exitosamente."
        }
      },
      {
        "status": 400,
        "error": "FAIL_VALIDATION",
        "messages": {
          "config": "El campo debe contener un valor único."
        }
      }
    ],
    "limit": 100,
    "affected": 1
  }
  ```
  
  **❌ 400 Fail Validation**
  ```JSON
  {
    "status": 400,
    "error": "FAIL_VALIDATION",
    "messages": {
      "config": "El campo es obligatorio."
    }
  }
  ```

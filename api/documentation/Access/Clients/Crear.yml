info:
  name: Crear
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/v1/access/clients"
  body:
    type: json
    data: |-
      {
        "name": "Sistema Externo",
        "description": "Integración con ERP",
        "is_disabled": "0"
      }

  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if ([201, 207].includes(res.getStatus())) {
          const d = res.getBody()?.data;
          const id = Array.isArray(d) ? d.find(i => i?.status === 201)?.data?.id : d?.id;
          if (id) bru.setEnvVar("client_id", String(id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Crear Cliente
  
  Registra un nuevo cliente. 
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/access/clients`
  - **Método**: `POST`
  - **Filtros**: `auth:module_code=acc_clients,only_user`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body
  
  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  name | string | Requerido. Máx: 60. Único. | Nombre del cliente.
  description | string | Opcional. | Descripción.
  is_disabled | string | Opcional. Valores: "0", "1". | Estado (0: activo, 1: inhabilitado).
  
  **Ejemplo Individual:**
  ```JSON
  {
    "name": "Sistema Externo",
    "description": "Integración con ERP",
    "is_disabled": "0"
  }
  ```
  
  **Ejemplo Masivo (vía `/v1/access/clients?is_batch=true`):**
  ```JSON
  [
    {
      "name": "Sistema Externo",
      "description": "Integración con ERP",
      "is_disabled": "0"
    },
    {
      "name": "Sistema Externo",
      "description": "Integración con ERP",
      "is_disabled": "0"
    }
  ]
  ```
  
  ## ⚙️ Reglas de Negocio
  1. El nombre del cliente debe ser único en el sistema.
  2. Al registrar el cliente se generan automáticamente sus credenciales de acceso (`client_id` y `client_secret`).
  3. La credencial secreta (`client_secret`) solo se entrega en la respuesta inmediata de creación o al solicitar regeneración.

  
  ## 📥 Respuestas (Responses)
  
  **✅ 201 Created (Éxito Individual)**
  ```JSON
  {
    "status": 201,
    "data": {
      "id": 10
    },
    "messages": {
      "success": "Registro creado exitosamente."
    }
  }
  ```
  
  **✅ 207 Multi-Status (Éxito/Error Masivo)**
  ```JSON
  {
    "status": 207,
    "data": [
      {
        "status": 201,
        "data": {
          "id": 10
        },
        "messages": {
          "success": "Registro creado exitosamente."
        }
      },
      {
        "status": 400,
        "error": "FAIL_VALIDATION",
        "messages": {
          "name": "El campo es obligatorio."
        }
      }
    ],
    "limit": 100,
    "affected": 1
  }
  ```
  
  **❌ 400 Fail Validation**
  ```JSON
  {
    "status": 400,
    "error": "FAIL_VALIDATION",
    "messages": {
      "name": "El campo debe contener un valor único."
    }
  }
  ```

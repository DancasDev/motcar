info:
  name: Consultar
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/access/users"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const d = res.getBody()?.data;
          const id = Array.isArray(d) ? d[0]?.id : d?.id;
          if (id) bru.setEnvVar("user_id", String(id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Consultar Usuario
  
  Recupera un usuario individual o un listado paginado y filtrado. Usa el motor de consultas.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/access/users` (Lista) o `{{base_url}}/v1/access/users/{{user_id}}` (Individual)
  - **Método**: `GET`
  - **Filtros**: `auth:module_code=acc_users`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Parámetros de Consulta (Query Params)
  Use la sintaxis del motor de consultas (ver documentación general): `fields`, `filters`, `order`, `page`, `itemsPerPage`, `groupBy`, `having`.
  
  
  ### Campos Disponibles

  Nombre | Nivel | Acciones | Descripción
  --- | --- | --- | ---
  id | 0 | L, F, O | ID del registro.
  username | 0 | L, F, O | Nombre de acceso.
  email | 0 | L, F, O | Correo.
  first_name | 0 | L, F, O | Nombre(s).
  last_name | 0 | L, F, O | Apellido(s).
  sex | 0 | L, F, O | Sexo ("0" = Masculino, "1" = Femenino).
  country_id | 0 | L, F, O | País.
  language_id | 0 | L, F, O | Idioma.
  time_zone_id | 0 | L, F, O | Zona horaria.
  force_to | 0 | L, F, O | Acciones forzadas.
  photo_url | 0 | L, F, O | Foto de perfil.
  is_disabled | 0 | L, F, O | Estado.
  created_at | 0 | L, F, O | Fecha de creación.
  updated_at | 0 | L, F, O | Fecha de modificación.
  deleted_at | 2 | L, F, O | Eliminación lógica (requiere nivel 2).
  
  > **Acciones:** `L`: Lectura (`fields`), `F`: Filtrado (`filters`), `O`: Ordenamiento (`order`), `G`: Agrupamiento (`groupBy`), `H`: Condición agregada (`having`).
  
  ## ⚙️ Reglas de Negocio
  1. Por motivos de seguridad, la contraseña (`password`) nunca se incluye ni se expone en las consultas de lectura.
  2. Permite consultar el directorio de usuarios con soporte para filtros de búsqueda y paginación.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Listado)**
  ```JSON
  {
    "data": [
      {
        "id": "10",
        "username": "dcastillo.dev"
      },
      {
        "id": "11",
        "username": "m.rodriguez"
      }
    ],
    "count": 2,
    "limit": 25,
    "in_trash": false
  }
  ```
  
  **✅ 200 OK (Individual)**
  ```JSON
  {
    "data": {
      "id": "10",
      "username": "dcastillo.dev"
    },
    "in_trash": false
  }
  ```
  
  **❌ 404 Registro No Encontrado**
  ```JSON
  {
    "status": 404,
    "error": "RECORD_NOT_FOUND",
    "messages": {
      "error": "El recurso solicitado no fue encontrado."
    }
  }
  ```

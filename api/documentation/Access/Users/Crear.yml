info:
  name: Crear
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/v1/access/users"
  body:
    type: json
    data: |-
      {
        "username": "dcastillo.dev",
        "password": "SecurePassword_123",
        "email": "daniel@example.com",
        "first_name": "Daniel",
        "last_name": "Castillo",
        "sex": "0",
        "country_id": 1,
        "language_id": 1,
        "time_zone_id": 1,
        "photo_url": "https://example.com/avatar.jpg",
        "force_to": "0,1",
        "is_disabled": "0"
      }

  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if ([201, 207].includes(res.getStatus())) {
          const d = res.getBody()?.data;
          const id = Array.isArray(d) ? d.find(i => i?.status === 201)?.data?.id : d?.id;
          if (id) bru.setEnvVar("user_id", String(id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Crear Usuario
  
  Registra un nuevo usuario. 
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/access/users`
  - **Método**: `POST`
  - **Filtros**: `auth:module_code=acc_users,only_user`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body
  
  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  username | string | Requerido. Mín: 8, Máx: 30. Único. Sin `@`. | Nombre de acceso único.
  password | string | Requerido. Mín: 8, Máx: 30. Robusta (mayúscula, minúscula, número y especial). | Contraseña.
  email | string | Requerido. Máx: 120. Correo válido. Único. | Correo.
  first_name | string | Requerido. Máx: 60. | Nombre(s).
  last_name | string | Requerido. Máx: 60. | Apellido(s).
  sex | string | Opcional. Valores: "0", "1". | Sexo.
  country_id | integer | Opcional. Debe existir en el catálogo. | País.
  language_id | integer | Opcional. Debe existir en el catálogo. | Idioma.
  time_zone_id | integer | Opcional. Debe existir en el catálogo. | Zona horaria.
  photo_url | string | Opcional. URL válida. | Foto de perfil.
  force_to | string | Opcional. Valores: "0", "1". | Acciones forzadas.
  is_disabled | string | Opcional. Valores: "0", "1". | Estado (0: activo, 1: inhabilitado).
  
  **Ejemplo Individual:**
  ```JSON
  {
    "username": "dcastillo.dev",
    "password": "SecurePassword_123",
    "email": "daniel@example.com",
    "first_name": "Daniel",
    "last_name": "Castillo",
    "sex": "0",
    "country_id": 1,
    "language_id": 1,
    "time_zone_id": 1,
    "photo_url": "https://example.com/avatar.jpg",
    "force_to": "0,1",
    "is_disabled": "0"
  }
  ```
  
  **Ejemplo Masivo (vía `/v1/access/users?is_batch=true`):**
  ```JSON
  [
    {
      "username": "dcastillo.dev",
      "password": "SecurePassword_123",
      "email": "daniel@example.com",
      "first_name": "Daniel",
      "last_name": "Castillo",
      "sex": "0",
      "country_id": 1,
      "language_id": 1,
      "time_zone_id": 1,
      "photo_url": "https://example.com/avatar.jpg",
      "force_to": "0,1",
      "is_disabled": "0"
    },
    {
      "username": "dcastillo.dev",
      "password": "SecurePassword_123",
      "email": "daniel@example.com",
      "first_name": "Daniel",
      "last_name": "Castillo",
      "sex": "0",
      "country_id": 1,
      "language_id": 1,
      "time_zone_id": 1,
      "photo_url": "https://example.com/avatar.jpg",
      "force_to": "0,1",
      "is_disabled": "0"
    }
  ]
  ```
  
  ## ⚙️ Reglas de Negocio
  1. Los campos `username` y `email` deben ser únicos en el sistema.
  2. `username` no puede contener el carácter `@` para evitar colisiones con el inicio de sesión por correo electrónico.
  3. La contraseña debe cumplir con la política de seguridad establecida (mínimo 8 caracteres, al menos una mayúscula, una minúscula, un número y un carácter especial).
  
  ## 📥 Respuestas (Responses)
  
  **✅ 201 Created (Éxito Individual)**
  ```JSON
  {
    "status": 201,
    "data": {
      "id": 10
    },
    "messages": {
      "success": "Registro creado exitosamente."
    }
  }
  ```
  
  **✅ 207 Multi-Status (Éxito/Error Masivo)**
  ```JSON
  {
    "status": 207,
    "data": [
      {
        "status": 201,
        "data": {
          "id": 10
        },
        "messages": {
          "success": "Registro creado exitosamente."
        }
      },
      {
        "status": 400,
        "error": "FAIL_VALIDATION",
        "messages": {
          "username": "El campo es obligatorio."
        }
      }
    ],
    "limit": 100,
    "affected": 1
  }
  ```
  
  **❌ 400 Fail Validation**
  ```JSON
  {
    "status": 400,
    "error": "FAIL_VALIDATION",
    "messages": {
      "username": "El campo debe contener un valor único."
    }
  }
  ```

info:
  name: Actualizar
  type: http
  seq: 3

http:
  method: PUT
  url: "{{base_url}}/v1/access/users/{{user_id}}"
  body:
    type: json
    data: |-
      {
        "username": "dcastillo.updated",
        "email": "daniel@example.com",
        "first_name": "Daniel"
      }

  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Actualizar Usuario
  
  Modifica uno o varios usuarios existentes.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/access/users/{{user_id}}` (Individual) o `{{base_url}}/v1/access/users` (Masivo)
  - **Método**: `PUT`
  - **Filtros**: `auth:module_code=acc_users,only_user`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body
  
  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  username | string | Opcional. Mín: 8, Máx: 30. Único. Sin `@`. | Nuevo nombre de acceso.
  email | string | Opcional. Máx: 120. Correo válido. Único. | Nuevo correo.
  first_name | string | Opcional. Máx: 60. | Nombre(s).
  password | string | Opcional. Mín: 8, Máx: 30. Robusta. | Cambio de contraseña.
  is_disabled | string | Opcional. Valores: "0", "1". | Estado (0: activo, 1: inhabilitado).
  
  **Ejemplo Individual:**
  ```JSON
  {
    "username": "dcastillo.updated",
    "email": "daniel@example.com",
    "first_name": "Daniel"
  }
  ```
  
  **Ejemplo Masivo (vía `/v1/access/users`, sin id en la URL):**
  ```JSON
  [
    {
      "id": 10,
      "username": "dcastillo.updated"
    },
    {
      "id": 11,
      "username": "dcastillo.updated"
    }
  ]
  ```
  
  ## ⚙️ Reglas de Negocio
  1. `username` no puede contener `@`.
  2. La contraseña debe cumplir las políticas de robustez y nunca se expone en respuestas de lectura.
  3. **Actualización parcial:** solo se modifican los campos enviados en el cuerpo de la petición.
  4. **Actualización masiva:** se habilita cuando no se envía identificador en la URL; cada objeto en el array debe incluir su `id`.
  5. Si la petición no incluye ningún campo modificable → `400 UPDATE_EMPTY_ITEM`.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Éxito Individual)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 10,
      "affected": true
    },
    "messages": {
      "success": "Registro actualizado exitosamente."
    }
  }
  ```
  
  **✅ 200 OK (Registro no afectado)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 999,
      "affected": false
    },
    "messages": {
      "success": "No se realizaron cambios porque los datos ya estaban actualizados."
    }
  }
  ```
  
  **✅ 207 Multi-Status (Éxito/Error Masivo)**
  ```JSON
  {
    "status": 207,
    "data": [
      {
        "status": 200,
        "data": {
          "id": 10,
          "affected": true
        },
        "messages": {
          "success": "Registro actualizado exitosamente."
        }
      },
      {
        "status": 400,
        "error": "FAIL_VALIDATION",
        "messages": {
          "username": "El campo debe contener un valor único."
        }
      }
    ],
    "limit": 100,
    "affected": 1
  }
  ```
  
  **❌ 400 Fail Validation**
  ```JSON
  {
    "status": 400,
    "error": "FAIL_VALIDATION",
    "messages": {
      "username": "El campo es obligatorio."
    }
  }
  ```

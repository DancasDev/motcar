info:
  name: Consultar
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/financing/notes/categories"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const d = res.getBody()?.data;
          const id = Array.isArray(d) ? d[0]?.id : d?.id;
          if (id) bru.setEnvVar("note_category_id", String(id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Consultar Categoría de Nota CRM
  
  Recupera una categoría individual o un listado paginado y filtrado de categorías de notas de participantes.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/financing/notes/categories` (Lista) o `{{base_url}}/v1/financing/notes/categories/{{note_category_id}}` (Individual)
  - **Método**: `GET`
  - **Filtros**: `auth:module_code=glb_note_categories`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Parámetros de Consulta (Query Params)
  Use la sintaxis del motor de consultas (ver documentación general): `fields`, `filters`, `order`, `page`, `itemsPerPage`, `groupBy`, `having`.
  
  ### Campos Disponibles
  
  Nombre | Nivel | Acciones | Descripción
  --- | --- | --- | ---
  id | 0 | L, F, O | ID del registro.
  name | 0 | L, F, O | Nombre descriptivo de la categoría.
  description | 0 | L, F, O | Descripción operativa.
  color | 0 | L, F, O | Código de color hexadecimal de la categoría.
  is_disabled | 0 | L, F, O | Estado (0: activo, 1: inhabilitado).
  created_at | 0 | L, F, O | Fecha de creación.
  updated_at | 0 | L, F, O | Fecha de modificación.
  deleted_at | 2 | L, F, O | Eliminación lógica (requiere nivel 2).
  
  > **Acciones:** `L`: Lectura (`fields`), `F`: Filtrado (`filters`), `O`: Ordenamiento (`order`), `G`: Agrupamiento (`groupBy`), `H`: Condición agregada (`having`).
  
  ## ⚙️ Reglas de Negocio
  1. Permite consultar el catálogo completo de categorías de notas con soporte para filtros de búsqueda y paginación.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Listado)**
  ```JSON
  {
    "data": [
      {
        "id": "1",
        "name": "Compromiso de Pago",
        "description": "Acuerdos y promesas de pago pactadas",
        "color": "#2ECC71",
        "is_disabled": "0"
      },
      {
        "id": "2",
        "name": "Incidencia Legal",
        "description": "Gestiones extrajudiciales",
        "color": "#E74C3C",
        "is_disabled": "0"
      }
    ],
    "count": 2,
    "limit": 25,
    "in_trash": false
  }
  ```
  
  **✅ 200 OK (Individual)**
  ```JSON
  {
    "data": {
      "id": "1",
      "name": "Compromiso de Pago",
      "description": "Acuerdos y promesas de pago pactadas",
      "color": "#2ECC71",
      "is_disabled": "0"
    },
    "in_trash": false
  }
  ```
  
  **❌ 404 Registro No Encontrado**
  ```JSON
  {
    "status": 404,
    "error": "RECORD_NOT_FOUND",
    "messages": {
      "error": "El recurso solicitado no fue encontrado."
    }
  }
  ```

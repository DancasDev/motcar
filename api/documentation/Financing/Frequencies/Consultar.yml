info:
  name: Consultar
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/financing/frequencies"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const d = res.getBody()?.data;
          const id = Array.isArray(d) ? d[0]?.id : d?.id;
          if (id) bru.setEnvVar("frequency_id", String(id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Consultar Frecuencias de Pago
  
  Recupera una periodicidad o frecuencia de cobro individual o el listado de frecuencias disponibles en el sistema (ej: semanal, quincenal, mensual).
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/financing/frequencies` (Lista) o `{{base_url}}/v1/financing/frequencies/{{frequency_id}}` (Individual)
  - **Método**: `GET`
  - **Filtros**: `auth` (compartido para usuarios y clientes autenticados)
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Parámetros de Consulta (Query Params)
  Use la sintaxis del motor de consultas (ver documentación general): `fields`, `filters`, `order`, `page`, `itemsPerPage`, `groupBy`, `having`.
  
  ### Campos Disponibles
  
  Nombre | Nivel | Acciones | Descripción
  --- | --- | --- | ---
  id | 0 | L, F, O | ID de la frecuencia.
  code | 0 | L, F, O | Código único de periodicidad (ej: "monthly", "biweekly", "weekly").
  name | 0 | L, F, O | Nombre descriptivo de la frecuencia (multilingüe).
  is_disabled | 0 | L, F, O | Estado (0: activo, 1: inhabilitado).
  created_at | 0 | L, F, O | Fecha de creación.
  updated_at | 0 | L, F, O | Fecha de modificación.
  deleted_at | 2 | L, F, O | Eliminación lógica (requiere nivel 2).
  
  > **Acciones:** `L`: Lectura (`fields`), `F`: Filtrado (`filters`), `O`: Ordenamiento (`order`), `G`: Agrupamiento (`groupBy`), `H`: Condición agregada (`having`).
  
  ## ⚙️ Reglas de Negocio
  1. Catálogo de periodicidades de solo lectura utilizado para la calendarización y generación de cronogramas de cuotas en grupos SAM.
  2. El campo `name` almacena traducciones estructuradas por idioma y se adapta según la cabecera `Accept-Language`.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Listado)**
  ```JSON
  {
    "data": [
      {
        "id": "1",
        "code": "monthly",
        "name": {
          "es": "Mensual",
          "en": "Monthly"
        },
        "is_disabled": "0"
      },
      {
        "id": "2",
        "code": "biweekly",
        "name": {
          "es": "Quincenal",
          "en": "Biweekly"
        },
        "is_disabled": "0"
      }
    ],
    "count": 2,
    "limit": 25,
    "in_trash": false
  }
  ```
  
  **✅ 200 OK (Individual)**
  ```JSON
  {
    "data": {
      "id": "1",
      "code": "monthly",
      "name": {
        "es": "Mensual",
        "en": "Monthly"
      },
      "is_disabled": "0"
    },
    "in_trash": false
  }
  ```
  
  **❌ 404 Registro No Encontrado**
  ```JSON
  {
    "status": 404,
    "error": "RECORD_NOT_FOUND",
    "messages": {
      "error": "El recurso solicitado no fue encontrado."
    }
  }
  ```

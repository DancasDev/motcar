info:
  name: Consultar
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/financing/contracts/types"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const d = res.getBody()?.data;
          const id = Array.isArray(d) ? d[0]?.id : d?.id;
          if (id) bru.setEnvVar("contract_type_id", String(id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Consultar Tipos de Contrato
  
  Recupera un tipo de contrato individual o un listado paginado y filtrado del catálogo de modalidades contractuales del sistema (ej: Autofinanciamiento Colectivo SAM).
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/financing/contracts/types` (Lista) o `{{base_url}}/v1/financing/contracts/types/{{contract_type_id}}` (Individual)
  - **Método**: `GET`
  - **Filtros**: `auth` (compartido para usuarios y clientes autenticados)
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Parámetros de Consulta (Query Params)
  Use la sintaxis del motor de consultas (ver documentación general): `fields`, `filters`, `order`, `page`, `itemsPerPage`, `groupBy`, `having`.
  
  ### Campos Disponibles
  
  Nombre | Nivel | Acciones | Descripción
  --- | --- | --- | ---
  id | 0 | L, F, O | ID del tipo de contrato.
  code | 0 | L, F, O | Código alfanumérico identificador.
  name | 0 | L, F, O | Nombre descriptivo del tipo de contrato.
  scope | 0 | L, F, O | Ámbito o alcance de aplicación.
  metadata_schema_id | 0 | L, F, O | Identificador del esquema de metadatos vinculado.
  metadata_schema_code | 0 | L, F, O | Código del esquema de metadatos (obtenido por relación).
  is_disabled | 0 | L, F, O | Estado (0: activo, 1: inhabilitado).
  created_at | 0 | L, F, O | Fecha de creación.
  updated_at | 0 | L, F, O | Fecha de modificación.
  deleted_at | 2 | L, F, O | Eliminación lógica (requiere nivel 2).
  
  > **Acciones:** `L`: Lectura (`fields`), `F`: Filtrado (`filters`), `O`: Ordenamiento (`order`), `G`: Agrupamiento (`groupBy`), `H`: Condición agregada (`having`).
  
  ## ⚙️ Reglas de Negocio
  1. Catálogo global de modalidades contractuales de solo lectura; no expone operaciones de mutación directa.
  2. Ofrece la base tipológica requerida para la formalización y emisión de contratos a adjudicatarios.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Listado)**
  ```JSON
  {
    "data": [
      {
        "id": "1",
        "code": "sam_collective",
        "name": "Autofinanciamiento Colectivo SAM",
        "scope": "0",
        "metadata_schema_id": null,
        "metadata_schema_code": null,
        "is_disabled": "0"
      }
    ],
    "count": 1,
    "limit": 25,
    "in_trash": false
  }
  ```
  
  **✅ 200 OK (Individual)**
  ```JSON
  {
    "data": {
      "id": "1",
      "code": "sam_collective",
      "name": "Autofinanciamiento Colectivo SAM",
      "scope": "0",
      "metadata_schema_id": null,
      "metadata_schema_code": null,
      "is_disabled": "0"
    },
    "in_trash": false
  }
  ```
  
  **❌ 404 Registro No Encontrado**
  ```JSON
  {
    "status": 404,
    "error": "RECORD_NOT_FOUND",
    "messages": {
      "error": "El recurso solicitado no fue encontrado."
    }
  }
  ```

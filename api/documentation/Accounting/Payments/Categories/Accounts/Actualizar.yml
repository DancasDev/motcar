docs: |-
  # Actualizar Cuenta Receptora de Pago
  
  Modifica una o varias cuentas receptoras de pago dentro de la categoría especificada.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/accounting/payments/categories/{{payment_account_category_id}}/accounts/{{payment_account_id}}` (Individual) o `{{base_url}}/v1/accounting/payments/categories/{{payment_account_category_id}}/accounts` (Masivo)
  - **Método**: `PUT`
  - **Filtros**: `auth:module_code=acc_payment_accounts,only_user`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body
  
  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  currency_id | integer | Opcional. ID de moneda activa y no eliminada. | Moneda en la que opera la cuenta.
  name | string | Opcional. Máx: 80. | Nombre descriptivo o comercial de la cuenta.
  metadata | object | Opcional. Sujeto al esquema de metadatos de la categoría. | Atributos adicionales dinámicos.
  is_disabled | string | Opcional. Valores: "0", "1". | Estado (0: activo, 1: inhabilitado).
  
  **Ejemplo Individual:**
  ```JSON
  {
    "name": "Banesco Banco Universal - Cta Recaudadora Principal",
    "metadata": {
      "account_number": "0134-1234-56-1234567890",
      "account_holder": "Motcar C.A. - Tesorería"
    }
  }
  ```
  
  **Ejemplo Masivo (vía `.../accounts`, sin id en la URL):**
  ```JSON
  [
    {
      "id": 1,
      "name": "Banesco Banco Universal - Cta Recaudadora Principal"
    },
    {
      "id": 2,
      "name": "Banco Mercantil - Cta Principal"
    }
  ]
  ```
  
  ## ⚙️ Reglas de Negocio
  1. No es posible reasignar la cuenta a otra categoría; el campo `category_id` se remueve automáticamente del payload.
  2. Si se suministra `metadata`, se valida nuevamente contra el esquema de metadatos de la categoría.
  3. Si la actualización altera registros (`affected > 0`), el sistema purga la memoria caché de cuentas de pago.
  4. **Actualización masiva:** se habilita cuando no se envía identificador en la URL; cada objeto en el array debe incluir su `id`.
  5. Si la petición no incluye ningún campo modificable → `400 UPDATE_EMPTY_ITEM`.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Éxito Individual)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 1,
      "affected": true
    },
    "messages": {
      "success": "Registro actualizado exitosamente."
    }
  }
  ```
  
  **✅ 200 OK (Registro no afectado)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 999,
      "affected": false
    },
    "messages": {
      "success": "No se realizaron cambios porque los datos ya estaban actualizados."
    }
  }
  ```
  
  **✅ 207 Multi-Status (Éxito/Error Masivo)**
  ```JSON
  {
    "status": 207,
    "data": [
      {
        "status": 200,
        "data": {
          "id": 1,
          "affected": true
        },
        "messages": {
          "success": "Registro actualizado exitosamente."
        }
      },
      {
        "status": 400,
        "error": "FAIL_VALIDATION",
        "messages": {
          "name": "El campo no puede exceder los 80 caracteres de longitud."
        }
      }
    ],
    "limit": 100,
    "affected": 1
  }
  ```
  
  **❌ 400 Fail Validation**
  ```JSON
  {
    "status": 400,
    "error": "FAIL_VALIDATION",
    "messages": {
      "name": "El campo no puede exceder los 80 caracteres de longitud."
    }
  }
  ```

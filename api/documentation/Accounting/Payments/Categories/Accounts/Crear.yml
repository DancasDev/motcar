info:
  name: Crear
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/v1/accounting/payments/categories/{{payment_account_category_id}}/accounts"
  body:
    type: json
    data: |-
      {
        "currency_id": 1,
        "name": "Banesco Banco Universal - Cta Corriente",
        "metadata": {
          "account_number": "0134-1234-56-1234567890",
          "account_holder": "Motcar C.A.",
          "holder_id": "J-12345678-9"
        },
        "is_disabled": "0"
      }

  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if ([201, 207].includes(res.getStatus())) {
          const d = res.getBody()?.data;
          const id = Array.isArray(d) ? d.find(i => i?.status === 201)?.data?.id : d?.id;
          if (id) bru.setEnvVar("payment_account_id", String(id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Crear Cuenta Receptora de Pago
  
  Registra un nuevo canal o cuenta receptora de fondos (cuenta bancaria, caja receptora, billetera) asociado a una categoría específica.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/accounting/payments/categories/{{payment_account_category_id}}/accounts` (Individual) o `{{base_url}}/v1/accounting/payments/categories/{{payment_account_category_id}}/accounts?is_batch=true` (Masivo)
  - **Método**: `POST`
  - **Filtros**: `auth:module_code=acc_payment_accounts,only_user`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body
  
  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  currency_id | integer | Requerido. ID de moneda activa y no eliminada. | Moneda en la que opera la cuenta de pago.
  name | string | Requerido. Máx: 80. | Nombre descriptivo o comercial de la cuenta de pago.
  metadata | object | Opcional. Debe cumplir el esquema de la categoría si posee uno. | Atributos adicionales dinámicos (número de cuenta, titular, etc.).
  is_disabled | string | Opcional. Valores: "0", "1". | Estado (0: activo, 1: inhabilitado).
  
  > `category_id` se vincula automáticamente desde el parámetro `{{payment_account_category_id}}` de la URL.
  
  **Ejemplo Individual:**
  ```JSON
  {
    "currency_id": 1,
    "name": "Banesco Banco Universal - Cta Corriente",
    "metadata": {
      "account_number": "0134-1234-56-1234567890",
      "account_holder": "Motcar C.A.",
      "holder_id": "J-12345678-9"
    },
    "is_disabled": "0"
  }
  ```
  
  **Ejemplo Masivo (vía `.../accounts?is_batch=true`):**
  ```JSON
  [
    {
      "currency_id": 1,
      "name": "Banesco Banco Universal - Cta Corriente",
      "metadata": {
        "account_number": "0134-1234-56-1234567890"
      },
      "is_disabled": "0"
    },
    {
      "currency_id": 1,
      "name": "Banco Mercantil - Cta Corriente",
      "metadata": {
        "account_number": "0105-9876-54-0987654321"
      },
      "is_disabled": "0"
    }
  ]
  ```
  
  ## ⚙️ Reglas de Negocio
  1. Si la categoría de la cuenta posee un esquema de metadatos asociado, el objeto `metadata` es validado rigurosamente contra dicho esquema.
  2. Al completar la inserción exitosa de cuentas, se invalida la memoria caché del catálogo de cuentas de pago.
  3. **Creación masiva:** se activa agregando el parámetro `?is_batch=true` en la URL y enviando un arreglo de objetos.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 201 Created (Éxito Individual)**
  ```JSON
  {
    "status": 201,
    "data": {
      "id": 1
    },
    "messages": {
      "success": "Registro creado exitosamente."
    }
  }
  ```
  
  **✅ 207 Multi-Status (Éxito/Error Masivo)**
  ```JSON
  {
    "status": 207,
    "data": [
      {
        "status": 201,
        "data": {
          "id": 1
        },
        "messages": {
          "success": "Registro creado exitosamente."
        }
      },
      {
        "status": 400,
        "error": "FAIL_VALIDATION",
        "messages": {
          "currency_id": "La moneda seleccionada no es válida o está inactiva."
        }
      }
    ],
    "limit": 100,
    "affected": 1
  }
  ```
  
  **❌ 400 Fail Validation**
  ```JSON
  {
    "status": 400,
    "error": "FAIL_VALIDATION",
    "messages": {
      "name": "El campo es obligatorio."
    }
  }
  ```

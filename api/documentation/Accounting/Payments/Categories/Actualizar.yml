      {
        "name": "Bancos e Instituciones Financieras"
      }

  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Actualizar Categoría de Cuenta de Pago
  
  Modifica una o varias categorías de cuentas de pago existentes.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/accounting/payments/categories/{{payment_account_category_id}}` (Individual) o `{{base_url}}/v1/accounting/payments/categories` (Masivo)
  - **Método**: `PUT`
  - **Filtros**: `auth:module_code=acc_payment_account_categories,only_user`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body
  
  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  name | string | Opcional. Máx: 60. | Nombre descriptivo de la categoría.
  metadata_schema_id | integer | Opcional. ID de esquema válido y activo. | Identificador del esquema de metadatos asociado.
  is_disabled | string | Opcional. Valores: "0", "1". | Estado (0: activo, 1: inhabilitado).
  
  **Ejemplo Individual:**
  ```JSON
  {
    "name": "Bancos e Instituciones Financieras"
  }
  ```
  
  **Ejemplo Masivo (vía `/v1/accounting/payments/categories`, sin id en la URL):**
  ```JSON
  [
    {
      "id": 1,
      "name": "Bancos e Instituciones Financieras"
    },
    {
      "id": 2,
      "name": "Efectivo y Caja Chica"
    }
  ]
  ```
  
  ## ⚙️ Reglas de Negocio
  1. Si hubo registros afectados (`affected > 0`), el sistema invalida automáticamente la memoria caché de categorías.
  2. Si se proporciona `metadata_schema_id`, debe existir y encontrarse activo en el catálogo de esquemas.
  3. **Actualización parcial:** solo se modifican los campos enviados en el cuerpo de la petición.
  4. **Actualización masiva:** se habilita cuando no se envía identificador en la URL; cada objeto en el array debe incluir su `id`.
  5. Si la petición no incluye ningún campo modificable → `400 UPDATE_EMPTY_ITEM`.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Éxito Individual)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 1,
      "affected": true
    },
    "messages": {
      "success": "Registro actualizado exitosamente."
    }
  }
  ```
  
  **✅ 200 OK (Registro no afectado)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 999,
      "affected": false
    },
    "messages": {
      "success": "No se realizaron cambios porque los datos ya estaban actualizados."
    }
  }
  ```
  
  **✅ 207 Multi-Status (Éxito/Error Masivo)**
  ```JSON
  {
    "status": 207,
    "data": [
      {
        "status": 200,
        "data": {
          "id": 1,
          "affected": true
        },
        "messages": {
          "success": "Registro actualizado exitosamente."
        }
      },
      {
        "status": 400,
        "error": "FAIL_VALIDATION",
        "messages": {
          "metadata_schema_id": "El esquema de metadatos especificado no es válido."
        }
      }
    ],
    "limit": 100,
    "affected": 1
  }
  ```
  
  **❌ 400 Fail Validation**
  ```JSON
  {
    "status": 400,
    "error": "FAIL_VALIDATION",
    "messages": {
      "name": "El campo no puede exceder los 60 caracteres de longitud."
    }
  }
  ```

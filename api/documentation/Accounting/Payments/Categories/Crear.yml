info:
  name: Crear
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/v1/accounting/payments/categories"
  body:
    type: json
    data: |-
      {
        "name": "Bancos Nacionales",
        "is_disabled": "0"
      }

  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if ([201, 207].includes(res.getStatus())) {
          const d = res.getBody()?.data;
          const id = Array.isArray(d) ? d.find(i => i?.status === 201)?.data?.id : d?.id;
          if (id) bru.setEnvVar("payment_account_category_id", String(id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Crear Categoría de Cuenta de Pago
  
  Registra una nueva categoría de canales receptores de pago (ej: Efectivo, Bancos Nacionales, Billeteras Digitales).
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/accounting/payments/categories` (Individual) o `{{base_url}}/v1/accounting/payments/categories?is_batch=true` (Masivo)
  - **Método**: `POST`
  - **Filtros**: `auth:module_code=acc_payment_account_categories,only_user`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body
  
  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  name | string | Requerido. Máx: 60. | Nombre descriptivo de la categoría de cuenta de pago.
  metadata_schema_id | integer | Opcional. ID de esquema válido y activo. | Identificador del esquema de metadatos dinámicos para sus cuentas.
  is_disabled | string | Opcional. Valores: "0", "1". | Estado (0: activo, 1: inhabilitado).
  
  **Ejemplo Individual:**
  ```JSON
  {
    "name": "Bancos Nacionales",
    "is_disabled": "0"
  }
  ```
  
  **Ejemplo Masivo (vía `/v1/accounting/payments/categories?is_batch=true`):**
  ```JSON
  [
    {
      "name": "Bancos Nacionales",
      "is_disabled": "0"
    },
    {
      "name": "Billeteras Electrónicas",
      "is_disabled": "0"
    }
  ]
  ```
  
  ## ⚙️ Reglas de Negocio
  1. Si se vincula un `metadata_schema_id`, este debe existir en el subsistema de metadatos y no estar eliminado ni deshabilitado.
  2. Al crear un registro exitoso, el sistema invalida automáticamente la caché de categorías de cuentas de pago.
  3. **Creación masiva:** se activa agregando el parámetro `?is_batch=true` en la URL y enviando un arreglo de objetos.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 201 Created (Éxito Individual)**
  ```JSON
  {
    "status": 201,
    "data": {
      "id": 1
    },
    "messages": {
      "success": "Registro creado exitosamente."
    }
  }
  ```
  
  **✅ 207 Multi-Status (Éxito/Error Masivo)**
  ```JSON
  {
    "status": 207,
    "data": [
      {
        "status": 201,
        "data": {
          "id": 1
        },
        "messages": {
          "success": "Registro creado exitosamente."
        }
      },
      {
        "status": 400,
        "error": "FAIL_VALIDATION",
        "messages": {
          "name": "El campo es obligatorio."
        }
      }
    ],
    "limit": 100,
    "affected": 1
  }
  ```
  
  **❌ 400 Fail Validation**
  ```JSON
  {
    "status": 400,
    "error": "FAIL_VALIDATION",
    "messages": {
      "name": "El campo es obligatorio."
    }
  }
  ```

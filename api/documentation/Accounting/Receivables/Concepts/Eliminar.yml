docs: |-
  # Eliminar Concepto de Cobro
  
  Mueve uno o varios conceptos de cobro a la papelera (soft delete).
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/accounting/receivables/concepts/{{receivable_concept_id}}` (Individual) o `{{base_url}}/v1/accounting/receivables/concepts` (Masivo)
  - **Método**: `DELETE`
  - **Filtros**: `auth:module_code=acc_receivable_concepts,only_user`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body
  
  **Ejemplo Masivo (vía `/v1/accounting/receivables/concepts`, sin id en la URL):**
  ```JSON
  [
    {
      "id": 1
    },
    {
      "id": 2
    }
  ]
  ```
  
  ## ⚙️ Reglas de Negocio
  1. **Soft delete:** registra `deleted_at`; el registro deja de aparecer en consultas estándar.
  2. Si hubo registros afectados (`affected > 0`), el sistema invalida automáticamente la caché de conceptos de cobro.
  3. **Eliminación permanente:** con `In-Trash: true` el borrado es físico, sujeto a integridad referencial (no tener cuentas por cobrar generadas asociadas).
  4. **Eliminación masiva:** se deduce por la ausencia de id en la URL; cada ítem debe incluir su `id`.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Eliminado)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 1,
      "affected": true
    },
    "messages": {
      "success": "Registro eliminado exitosamente."
    }
  }
  ```
  
  **✅ 200 OK (No existía / no afectado)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 999,
      "affected": false
    },
    "messages": {
      "success": "No se realizaron cambios porque los datos ya estaban actualizados."
    }
  }
  ```
  
  **✅ 207 Multi-Status (Éxito/Error Masivo)**
  ```JSON
  {
    "status": 207,
    "data": [
      {
        "status": 200,
        "data": {
          "id": 1,
          "affected": true
        },
        "messages": {
          "success": "Registro eliminado exitosamente."
        }
      },
      {
        "status": 400,
        "error": "FAIL_VALIDATION",
        "messages": {
          "id": "El campo es obligatorio."
        }
      }
    ],
    "limit": 100,
    "affected": 1
  }
  ```

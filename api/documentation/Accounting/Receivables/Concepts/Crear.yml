info:
  name: Crear
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/v1/accounting/receivables/concepts"
  body:
    type: json
    data: |-
      {
        "code": "installment",
        "name": "Cuota Periódica SAM",
        "template": "Cuota #{installment_number} de {total_installments} - Grupo {group_name}",
        "is_disabled": "0"
      }

  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if ([201, 207].includes(res.getStatus())) {
          const d = res.getBody()?.data;
          const id = Array.isArray(d) ? d.find(i => i?.status === 201)?.data?.id : d?.id;
          if (id) bru.setEnvVar("receivable_concept_id", String(id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Crear Concepto de Cobro
  
  Registra un nuevo concepto o clasificador de cuentas por cobrar (ej: cuotas periódicas, inscripción, seguros, cargos administrativos).
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/accounting/receivables/concepts` (Individual) o `{{base_url}}/v1/accounting/receivables/concepts?is_batch=true` (Masivo)
  - **Método**: `POST`
  - **Filtros**: `auth:module_code=acc_receivable_concepts,only_user`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body
  
  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  code | string | Requerido. Alfanumérico con guiones (`alpha_dash`). Máx: 40. Único. | Código identificador del concepto (ej: "installment", "registration_fee").
  name | string | Requerido. Máx: 80. | Nombre descriptivo del concepto.
  template | string | Opcional. Máx: 200. | Plantilla dinámica utilizada para generar la glosa de la cuenta por cobrar.
  is_disabled | string | Opcional. Valores: "0", "1". | Estado (0: activo, 1: inhabilitado).
  
  **Ejemplo Individual:**
  ```JSON
  {
    "code": "installment",
    "name": "Cuota Periódica SAM",
    "template": "Cuota #{installment_number} de {total_installments} - Grupo {group_name}",
    "is_disabled": "0"
  }
  ```
  
  **Ejemplo Masivo (vía `/v1/accounting/receivables/concepts?is_batch=true`):**
  ```JSON
  [
    {
      "code": "installment",
      "name": "Cuota Periódica SAM",
      "template": "Cuota #{installment_number} de {total_installments}",
      "is_disabled": "0"
    },
    {
      "code": "registration_fee",
      "name": "Gastos de Inscripción",
      "template": "Cuota de Inscripción - Contrato {contract_number}",
      "is_disabled": "0"
    }
  ]
  ```
  
  ## ⚙️ Reglas de Negocio
  1. El campo `code` debe ser único en el catálogo de conceptos de cobro.
  2. Si la creación resulta exitosa, el sistema invalida automáticamente la memoria caché de conceptos de cobro.
  3. **Creación masiva:** se activa agregando el parámetro `?is_batch=true` en la URL y enviando un arreglo de objetos.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 201 Created (Éxito Individual)**
  ```JSON
  {
    "status": 201,
    "data": {
      "id": 1
    },
    "messages": {
      "success": "Registro creado exitosamente."
    }
  }
  ```
  
  **✅ 207 Multi-Status (Éxito/Error Masivo)**
  ```JSON
  {
    "status": 207,
    "data": [
      {
        "status": 201,
        "data": {
          "id": 1
        },
        "messages": {
          "success": "Registro creado exitosamente."
        }
      },
      {
        "status": 400,
        "error": "FAIL_VALIDATION",
        "messages": {
          "code": "El campo debe contener un valor único."
        }
      }
    ],
    "limit": 100,
    "affected": 1
  }
  ```
  
  **❌ 400 Fail Validation**
  ```JSON
  {
    "status": 400,
    "error": "FAIL_VALIDATION",
    "messages": {
      "code": "El campo debe contener un valor único."
    }
  }
  ```

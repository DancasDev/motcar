  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Actualizar Concepto de Cobro
  
  Modifica uno o varios conceptos de cobro existentes.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/accounting/receivables/concepts/{{receivable_concept_id}}` (Individual) o `{{base_url}}/v1/accounting/receivables/concepts` (Masivo)
  - **Método**: `PUT`
  - **Filtros**: `auth:module_code=acc_receivable_concepts,only_user`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body
  
  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  code | string | Opcional. Formato `alpha_dash`. Máx: 40. Único. | Código identificador del concepto.
  name | string | Opcional. Máx: 80. | Nombre descriptivo del concepto.
  template | string | Opcional. Máx: 200. | Plantilla dinámica para glosas.
  is_disabled | string | Opcional. Valores: "0", "1". | Estado (0: activo, 1: inhabilitado).
  
  **Ejemplo Individual:**
  ```JSON
  {
    "name": "Cuota Mensual SAM Regular",
    "template": "Cuota #{installment_number} de {total_installments} - SAM Motcar"
  }
  ```
  
  **Ejemplo Masivo (vía `/v1/accounting/receivables/concepts`, sin id en la URL):**
  ```JSON
  [
    {
      "id": 1,
      "name": "Cuota Mensual SAM Regular"
    },
    {
      "id": 2,
      "name": "Cuota de Inscripción y Apertura"
    }
  ]
  ```
  
  ## ⚙️ Reglas de Negocio
  1. Si se actualiza `code`, debe conservar la unicidad en el catálogo.
  2. Si la modificación afecta registros (`affected > 0`), se invalida automáticamente la caché de conceptos de cobro.
  3. **Actualización parcial:** solo se modifican los campos enviados en el cuerpo de la petición.
  4. **Actualización masiva:** se habilita cuando no se envía identificador en la URL; cada objeto en el array debe incluir su `id`.
  5. Si la petición no incluye ningún campo modificable → `400 UPDATE_EMPTY_ITEM`.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Éxito Individual)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 1,
      "affected": true
    },
    "messages": {
      "success": "Registro actualizado exitosamente."
    }
  }
  ```
  
  **✅ 200 OK (Registro no afectado)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 999,
      "affected": false
    },
    "messages": {
      "success": "No se realizaron cambios porque los datos ya estaban actualizados."
    }
  }
  ```
  
  **✅ 207 Multi-Status (Éxito/Error Masivo)**
  ```JSON
  {
    "status": 207,
    "data": [
      {
        "status": 200,
        "data": {
          "id": 1,
          "affected": true
        },
        "messages": {
          "success": "Registro actualizado exitosamente."
        }
      },
      {
        "status": 400,
        "error": "FAIL_VALIDATION",
        "messages": {
          "code": "El campo debe contener un valor único."
        }
      }
    ],
    "limit": 100,
    "affected": 1
  }
  ```
  
  **❌ 400 Fail Validation**
  ```JSON
  {
    "status": 400,
    "error": "FAIL_VALIDATION",
    "messages": {
      "code": "El campo debe contener un valor único."
    }
  }
  ```

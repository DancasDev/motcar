  maxRedirects: 5

docs: |-
  # Actualizar Moneda
  
  Modifica una o varias monedas existentes en el catálogo.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/accounting/currencies/{{currency_id}}` (Individual) o `{{base_url}}/v1/accounting/currencies` (Masivo)
  - **Método**: `PUT`
  - **Filtros**: `auth:module_code=acc_currencies,only_user`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body
  
  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  name | string | Opcional. Máx: 60. | Nombre descriptivo de la moneda.
  code | string | Opcional. Alfabético. Longitud: 3. Único. | Código ISO 4217 de la moneda.
  symbol | string | Opcional. Máx: 10. | Símbolo representativo.
  is_disabled | string | Opcional. Valores: "0", "1". | Estado (0: activo, 1: inhabilitado).
  
  **Ejemplo Individual:**
  ```JSON
  {
    "name": "Dólar Americano",
    "symbol": "US$"
  }
  ```
  
  **Ejemplo Masivo (vía `/v1/accounting/currencies`, sin id en la URL):**
  ```JSON
  [
    {
      "id": 1,
      "name": "Dólar Americano",
      "symbol": "US$"
    },
    {
      "id": 2,
      "name": "Bolívar Digital",
      "symbol": "Bs.D"
    }
  ]
  ```
  
  ## ⚙️ Reglas de Negocio
  1. Si se modifica `code`, debe mantener el formato de 3 caracteres alfabéticos y no colisionar con otra moneda existente.
  2. Si hubo registros afectados (`affected > 0`), el sistema purga automáticamente la memoria caché de monedas.
  3. **Actualización parcial:** solo se modifican los campos enviados en el cuerpo de la petición.
  4. **Actualización masiva:** se habilita cuando no se envía identificador en la URL; cada objeto en el array debe incluir su `id`.
  5. Si la petición no incluye ningún campo modificable → `400 UPDATE_EMPTY_ITEM`.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Éxito Individual)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 1,
      "affected": true
    },
    "messages": {
      "success": "Registro actualizado exitosamente."
    }
  }
  ```
  
  **✅ 200 OK (Registro no afectado)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 999,
      "affected": false
    },
    "messages": {
      "success": "No se realizaron cambios porque los datos ya estaban actualizados."
    }
  }
  ```
  
  **✅ 207 Multi-Status (Éxito/Error Masivo)**
  ```JSON
  {
    "status": 207,
    "data": [
      {
        "status": 200,
        "data": {
          "id": 1,
          "affected": true
        },
        "messages": {
          "success": "Registro actualizado exitosamente."
        }
      },
      {
        "status": 400,
        "error": "FAIL_VALIDATION",
        "messages": {
          "code": "El campo debe contener un valor único."
        }
      }
    ],
    "limit": 100,
    "affected": 1
  }
  ```
  
  **❌ 400 Fail Validation**
  ```JSON
  {
    "status": 400,
    "error": "FAIL_VALIDATION",
    "messages": {
      "code": "El campo debe contener un valor único."
    }
  }
  ```

docs: |-
  # Consultar Tasa de Cambio Actual
  
  Obtiene la tasa de cambio más reciente y vigente para una moneda determinada, recuperándola optimizadamente desde la memoria caché del sistema.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/accounting/currencies/{{currency_id}}/exchange-rates/current`
  - **Método**: `GET`
  - **Filtros**: `auth:module_code=acc_exchange_rates`
  - **Límite**: no aplica
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  Este endpoint no requiere parámetros ni cuerpo en la petición. El identificador de la moneda se suministra en la URL (`{{currency_id}}`).
  
  ## ⚙️ Reglas de Negocio
  1. Si la moneda no existe, se encuentra deshabilitada o no está disponible en la caché, retorna `404 RECORD_NOT_FOUND`.
  2. La cotización retornada corresponde a la fecha más reciente registrada para la moneda.
  3. No aplica procesamiento masivo (endpoint puntual de consulta).
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK**
  ```JSON
  {
    "status": 200,
    "data": {
      "currency_id": 1,
      "value": "45.2500",
      "date": "2026-10-05"
    }
  }
  ```
  
  **❌ 404 Registro No Encontrado**
  ```JSON
  {
    "status": 404,
    "error": "RECORD_NOT_FOUND",
    "messages": {
      "error": "El recurso solicitado no fue encontrado."
    }
  }
  ```

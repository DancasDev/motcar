http:
  method: PUT
  url: "{{base_url}}/v1/accounting/currencies/{{currency_id}}/exchange-rates/{{exchange_rate_id}}"
  body:
    type: json
    data: |-
      {
        "value": 45.3000
      }

  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Actualizar Tasa de Cambio
  
  Modifica una o varias tasas de cambio registradas bajo la moneda especificada.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/accounting/currencies/{{currency_id}}/exchange-rates/{{exchange_rate_id}}` (Individual) o `{{base_url}}/v1/accounting/currencies/{{currency_id}}/exchange-rates` (Masivo)
  - **Método**: `PUT`
  - **Filtros**: `auth:module_code=acc_exchange_rates,only_user`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body
  
  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  date | string | Opcional. Formato fecha válido (YYYY-MM-DD). Único por moneda. | Fecha correspondiente a la cotización.
  value | float/decimal | Opcional. Decimal mayor a 0. | Nuevo valor de la tasa de cambio.
  
  **Ejemplo Individual:**
  ```JSON
  {
    "value": 45.3000
  }
  ```
  
  **Ejemplo Masivo (vía `.../exchange-rates`, sin id en la URL):**
  ```JSON
  [
    {
      "id": 1,
      "value": 45.3000
    },
    {
      "id": 2,
      "value": 45.3500
    }
  ]
  ```
  
  ## ⚙️ Reglas de Negocio
  1. No es posible reasignar la tasa a otra moneda; cualquier campo `currency_id` en el body es descartado automáticamente.
  2. Si se actualiza el campo `date`, se verifica que no colisione con otra cotización existente para la misma moneda.
  3. Si la operación afecta registros (`affected > 0`), se invalida la memoria caché de monedas del sistema.
  4. **Actualización masiva:** se habilita cuando no se envía identificador en la URL; cada objeto en el array debe incluir su `id`.
  5. Si la petición no incluye ningún campo modificable → `400 UPDATE_EMPTY_ITEM`.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Éxito Individual)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 1,
      "affected": true
    },
    "messages": {
      "success": "Registro actualizado exitosamente."
    }
  }
  ```
  
  **✅ 200 OK (Registro no afectado)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 999,
      "affected": false
    },
    "messages": {
      "success": "No se realizaron cambios porque los datos ya estaban actualizados."
    }
  }
  ```
  
  **✅ 207 Multi-Status (Éxito/Error Masivo)**
  ```JSON
  {
    "status": 207,
    "data": [
      {
        "status": 200,
        "data": {
          "id": 1,
          "affected": true
        },
        "messages": {
          "success": "Registro actualizado exitosamente."
        }
      },
      {
        "status": 400,
        "error": "FAIL_VALIDATION",
        "messages": {
          "value": "El campo debe ser un número decimal mayor a cero."
        }
      }
    ],
    "limit": 100,
    "affected": 1
  }
  ```
  
  **❌ 400 Fail Validation**
  ```JSON
  {
    "status": 400,
    "error": "FAIL_VALIDATION",
    "messages": {
      "value": "El campo debe ser un número decimal mayor a cero."
    }
  }
  ```

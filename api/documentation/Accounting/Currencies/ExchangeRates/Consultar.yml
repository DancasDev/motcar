info:
  name: Consultar
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/accounting/currencies/{{currency_id}}/exchange-rates"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const d = res.getBody()?.data;
          const id = Array.isArray(d) ? d[0]?.id : d?.id;
          if (id) bru.setEnvVar("exchange_rate_id", String(id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Consultar Tasa de Cambio
  
  Recupera una tasa de cambio individual o un histórico paginado y filtrado para la moneda especificada.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/accounting/currencies/{{currency_id}}/exchange-rates` (Lista) o `{{base_url}}/v1/accounting/currencies/{{currency_id}}/exchange-rates/{{exchange_rate_id}}` (Individual)
  - **Método**: `GET`
  - **Filtros**: `auth:module_code=acc_exchange_rates`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Parámetros de Consulta (Query Params)
  Use la sintaxis del motor de consultas (ver documentación general): `fields`, `filters`, `order`, `page`, `itemsPerPage`, `groupBy`, `having`.
  
  ### Campos Disponibles
  
  Nombre | Nivel | Acciones | Descripción
  --- | --- | --- | ---
  id | 0 | L, F, O | ID del registro.
  currency_id | 0 | L, F, O | ID de la moneda asociada.
  currency_code | 0 | L, F, O | Código ISO de la moneda padre.
  currency_name | 0 | L, F, O | Nombre de la moneda padre.
  currency_symbol | 0 | L, F, O | Símbolo de la moneda padre.
  date | 0 | L, F, O | Fecha de la cotización.
  value | 0 | L, F, O | Valor de la tasa de cambio.
  created_at | 0 | L, F, O | Fecha de creación.
  updated_at | 0 | L, F, O | Fecha de modificación.
  deleted_at | 2 | L, F, O | Eliminación lógica (requiere nivel 2).
  
  > **Acciones:** `L`: Lectura (`fields`), `F`: Filtrado (`filters`), `O`: Ordenamiento (`order`), `G`: Agrupamiento (`groupBy`), `H`: Condición agregada (`having`).
  
  ## ⚙️ Reglas de Negocio
  1. La consulta siempre restringe automáticamente los resultados a la moneda indicada en `{{currency_id}}`.
  2. Los campos vinculados (`currency_code`, `currency_name`, `currency_symbol`) se resuelven automáticamente mediante relaciones internas del motor de consulta.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Listado)**
  ```JSON
  {
    "data": [
      {
        "id": "1",
        "currency_id": "1",
        "currency_code": "USD",
        "date": "2026-10-05",
        "value": "45.2500"
      },
      {
        "id": "2",
        "currency_id": "1",
        "currency_code": "USD",
        "date": "2026-10-04",
        "value": "45.1000"
      }
    ],
    "count": 2,
    "limit": 25,
    "in_trash": false
  }
  ```
  
  **✅ 200 OK (Individual)**
  ```JSON
  {
    "data": {
      "id": "1",
      "currency_id": "1",
      "currency_code": "USD",
      "date": "2026-10-05",
      "value": "45.2500"
    },
    "in_trash": false
  }
  ```
  
  **❌ 404 Registro No Encontrado**
  ```JSON
  {
    "status": 404,
    "error": "RECORD_NOT_FOUND",
    "messages": {
      "error": "El recurso solicitado no fue encontrado."
    }
  }
  ```

info:
  name: Consultar
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/accounting/currencies"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const d = res.getBody()?.data;
          const id = Array.isArray(d) ? d[0]?.id : d?.id;
          if (id) bru.setEnvVar("currency_id", String(id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Consultar Moneda
  
  Recupera una moneda individual o un listado paginado y filtrado del catálogo de monedas.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/accounting/currencies` (Lista) o `{{base_url}}/v1/accounting/currencies/{{currency_id}}` (Individual)
  - **Método**: `GET`
  - **Filtros**: `auth:module_code=acc_currencies`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Parámetros de Consulta (Query Params)
  Use la sintaxis del motor de consultas (ver documentación general): `fields`, `filters`, `order`, `page`, `itemsPerPage`, `groupBy`, `having`.
  
  ### Campos Disponibles
  
  Nombre | Nivel | Acciones | Descripción
  --- | --- | --- | ---
  id | 0 | L, F, O | ID del registro.
  name | 0 | L, F, O | Nombre descriptivo de la moneda.
  code | 0 | L, F, O | Código ISO 4217 de la moneda.
  symbol | 0 | L, F, O | Símbolo representativo.
  is_disabled | 0 | L, F, O | Estado (0: activo, 1: inhabilitado).
  created_at | 0 | L, F, O | Fecha de creación.
  updated_at | 0 | L, F, O | Fecha de modificación.
  deleted_at | 2 | L, F, O | Eliminación lógica (requiere nivel 2).
  
  > **Acciones:** `L`: Lectura (`fields`), `F`: Filtrado (`filters`), `O`: Ordenamiento (`order`), `G`: Agrupamiento (`groupBy`), `H`: Condición agregada (`having`).
  
  ## ⚙️ Reglas de Negocio
  1. Permite consultar el catálogo general de monedas con soporte para filtros de búsqueda y paginación.
  2. Si se consulta por ID individual, el registro debe encontrarse activo y no eliminado a menos que se incluya el header `In-Trash: true`.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Listado)**
  ```JSON
  {
    "data": [
      {
        "id": "1",
        "name": "Dólar Estadounidense",
        "code": "USD",
        "symbol": "$",
        "is_disabled": "0"
      },
      {
        "id": "2",
        "name": "Bolívar Digital",
        "code": "VES",
        "symbol": "Bs.",
        "is_disabled": "0"
      }
    ],
    "count": 2,
    "limit": 25,
    "in_trash": false
  }
  ```
  
  **✅ 200 OK (Individual)**
  ```JSON
  {
    "data": {
      "id": "1",
      "name": "Dólar Estadounidense",
      "code": "USD",
      "symbol": "$",
      "is_disabled": "0"
    },
    "in_trash": false
  }
  ```
  
  **❌ 404 Registro No Encontrado**
  ```JSON
  {
    "status": 404,
    "error": "RECORD_NOT_FOUND",
    "messages": {
      "error": "El recurso solicitado no fue encontrado."
    }
  }
  ```

info:
  name: Consultar
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/catalogs/document-types"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const d = res.getBody()?.data;
          const id = Array.isArray(d) ? d[0]?.id : d?.id;
          if (id) bru.setEnvVar("document_type_id", String(id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Consultar Tipos de Documento

  Recupera un tipo de documento individual o un listado paginado y filtrado del catálogo global. Usa el motor de consultas.

  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/catalogs/document-types` (Lista) o `{{base_url}}/v1/catalogs/document-types/{{document_type_id}}` (Individual)
  - **Método**: `GET`
  - **Filtros**: `auth` (compartido: usuario o cliente autenticado).
  - **Límite**: por defecto

  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.

  ## 📤 Datos de Solicitud (Request)

  ### Parámetros de Consulta (Query Params)
  Use la sintaxis del motor de consultas (ver documentación general): `fields`, `filters`, `order`, `page`, `itemsPerPage`, `groupBy`, `having`.

  ### Campos Disponibles

  Nombre | Nivel | Acciones | Descripción
  --- | --- | --- | ---
  id | 0 | L, F, O | ID del tipo de documento.
  code | 0 | L, F, O | Código del formato (ej: `a4-portrait`, `a4-landscape`, `letter`).
  width | 0 | L, F, O | Ancho del formato en puntos.
  height | 0 | L, F, O | Alto del formato en puntos.
  name | 0 | L | **Calculado.** Nombre del formato según `Accept-Language`.
  description | 0 | L | **Calculado.** Descripción del formato según `Accept-Language`.
  is_disabled | 0 | L, F, O | Estado (0: activo, 1: inhabilitado).
  created_at | 0 | L, F, O | Fecha de creación.
  updated_at | 0 | L, F, O | Fecha de modificación.
  deleted_at | 2 | L, F, O | Eliminación lógica (requiere nivel 2).

  > **Acciones:** `L`: Lectura (`fields`), `F`: Filtrado (`filters`), `O`: Ordenamiento (`order`), `G`: Agrupamiento (`groupBy`), `H`: Condición agregada (`having`).

  ## ⚙️ Reglas de Negocio
  1. Catálogo de formatos de documento de solo lectura.
  2. `name` y `description` se entregan traducidos según la cabecera `Accept-Language`.
  3. `width` y `height` definen las dimensiones canónicas del documento en puntos.

  ## 📥 Respuestas (Responses)

  **✅ 200 OK (Listado)**
  ```JSON
  {
    "data": [
      { "id": "1", "code": "a4-portrait", "width": "595.28", "height": "841.89", "name": "A4 vertical", "is_disabled": "0" },
      { "id": "2", "code": "a4-landscape", "width": "841.89", "height": "595.28", "name": "A4 horizontal", "is_disabled": "0" }
    ],
    "count": 2,
    "limit": 25,
    "in_trash": false
  }
  ```

  **✅ 200 OK (Individual)**
  ```JSON
  {
    "data": { "id": "1", "code": "a4-portrait", "width": "595.28", "height": "841.89", "name": "A4 vertical", "is_disabled": "0" },
    "in_trash": false
  }
  ```

  **❌ 404 Registro No Encontrado**
  ```JSON
  {
    "status": 404,
    "error": "RECORD_NOT_FOUND",
    "messages": {
      "error": "El recurso solicitado no fue encontrado."
    }
  }
  ```

info:
  name: Logout
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{base_url}}/v1/auth/client"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Cerrar Sesión de Cliente

  Invalida el token JWT actual del cliente autenticado de forma permanente.

  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/auth/client`
  - **Método**: `DELETE`
  - **Filtros**: `auth:only_client`

  ## ⚙️ Reglas de Negocio
  1. **Blacklist:** tras el logout, el token queda inhabilitado; cualquier uso posterior → `401 AUTH_TOKEN_IS_DISABLED`.

  ## 📥 Respuestas (Responses)

  **✅ 200 OK (Éxito)**
  ```JSON
  {
    "status": 200,
    "data": [],
    "messages": {
      "success": "Hasta luego, Sistema Externo"
    }
  }
  ```

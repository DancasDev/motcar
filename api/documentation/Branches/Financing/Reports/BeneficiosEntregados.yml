info:
  name: BeneficiosEntregados
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/v1/branches/{{branch_id}}/financing/reports/awarded-benefits"
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Reporte de Beneficios Entregados y Adjudicados

  Listado histórico de todos los beneficios entregados por sorteo o adjudicación en los grupos SAM, detallando la ficha técnica/metadatos del bien entregado y el estado de solvencia actual del participante.

  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/branches/{{branch_id}}/financing/reports/awarded-benefits`
  - **Método**: `GET`
  - **Filtros**: `auth:scope=uri|3,module_code=fnc_san_groups`
  - **Parámetros de Consulta (Query Params)**:
    - `group_id` *(opcional, entero)*: Filtra los beneficios entregados en un grupo SAM específico.

  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.

  ## 📤 Datos de Solicitud (Request)
  No requiere cuerpo. Parámetros opcionales vía query string.

  ## ⚙️ Reglas de Negocio
  1. Filtra los participantes que tengan fecha formal de adjudicación (`awarded_at IS NOT NULL`).
  2. Extrae y parsea el objeto dinámico `benefit_metadata`, cuya estructura y atributos se rigen por el modelo de metadatos del tipo de contrato asignado al grupo (`fnc_contract_type.metadata_schema_id`).
  3. Evalúa en tiempo real si el participante que ya recibió el beneficio sigue solvente o cayó en mora (`is_overdue`, `overdue_amount`, `overdue_count`), permitiendo auditorías inmediatas de riesgo.
  4. Los resultados se entregan ordenados cronológicamente por la fecha de adjudicación más reciente (`awarded_at DESC`).

  ## 📥 Respuestas (Responses)

  **✅ 200 OK**

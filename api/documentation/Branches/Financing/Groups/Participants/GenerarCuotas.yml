http:
  method: POST
  url: "{{base_url}}/v1/branches/{{branch_id}}/financing/groups/{{group_id}}/participants/{{participant_id}}/generate-receivables"
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Generar Cuotas Individuales de Participante
  
  Genera o regenera el cronograma de cuentas por cobrar para el participante específico del grupo SAM.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/branches/{{branch_id}}/financing/groups/{{group_id}}/participants/{{participant_id}}/generate-receivables`
  - **Método**: `POST`
  - **Filtros**: `auth:scope=uri|3,module_code=fnc_san_participants,only_user`
  - **Límite**: no aplica
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  No requiere payload en el cuerpo. Los identificadores de sucursal, grupo y participante se transmiten en la URL.
  
  ## ⚙️ Reglas de Negocio
  1. Si el participante posee cuotas ya pagadas o con pagos parciales, estas se conservan íntegramente. Las cuotas pendientes no pagadas se regeneran respetando la secuencia del cronograma.
  2. Al culminar la generación, actualiza de inmediato el indicador de morosidad (`is_overdue`) del participante evaluando las fechas de vencimiento generadas.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 201 Created**
  ```JSON
  {
    "status": 201,
    "data": {
      "group_id": 1,
      "participants": 1,
      "installments": 24,
      "generated": 24
    }
  }
  ```
  
  **❌ 404 Registro No Encontrado**
  ```JSON
  {
    "status": 404,
    "error": "RECORD_NOT_FOUND",
    "messages": {
      "error": "El recurso solicitado no fue encontrado."
    }
  }
  ```

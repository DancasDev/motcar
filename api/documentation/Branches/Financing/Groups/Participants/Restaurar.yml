docs: |-
  # Restaurar Participante de Grupo SAM
  
  Restaura una o varias inscripciones de participantes previamente eliminadas de la papelera (soft delete).
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/branches/{{branch_id}}/financing/groups/{{group_id}}/participants/{{participant_id}}` (Individual) o `{{base_url}}/v1/branches/{{branch_id}}/financing/groups/{{group_id}}/participants` (Masivo)
  - **Método**: `PATCH`
  - **Filtros**: `auth:scope=uri|3,module_code=fnc_san_participants,only_user`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body
  
  **Ejemplo Masivo (vía `.../participants`, sin id en la URL):**
  ```JSON
  [
    {
      "id": 1
    },
    {
      "id": 2
    }
  ]
  ```
  
  ## ⚙️ Reglas de Negocio
  1. Si la restauración de los registros causaría que el grupo exceda el límite permitido (`participant_max`), la petición se rechaza con `400 GROUP_MAX_PARTICIPANTS_REACHED`.
  2. Limpia `deleted_at` y actualiza atómicamente el total `participant_count` del grupo SAM.
  3. **Restauración masiva:** se deduce por la ausencia de id en la URL; cada ítem debe incluir su `id`.
  4. Si el registro no existe o no está en la papelera → `200` con `affected: false`.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Restaurado)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 1,
      "affected": true
    },
    "messages": {
      "success": "Registro restaurado exitosamente."
    }
  }
  ```
  
  **✅ 200 OK (No estaba en papelera)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 999,
      "affected": false
    },
    "messages": {
      "success": "No se realizaron cambios porque los datos ya estaban actualizados."
    }
  }
  ```
  
  **✅ 207 Multi-Status (Éxito/Error Masivo)**
  ```JSON
  {
    "status": 207,
    "data": [
      {
        "status": 200,
        "data": {
          "id": 1,
          "affected": true
        },
        "messages": {
          "success": "Registro restaurado exitosamente."
        }
      },
      {
        "status": 400,
        "error": "FAIL_VALIDATION",
        "messages": {
          "id": "El campo es obligatorio."
        }
      }
    ],
    "limit": 100,
    "affected": 1
  }
  ```
  
  **❌ 400 Cupo Máximo Excedido**
  ```JSON
  {
    "status": 400,
    "error": "GROUP_MAX_PARTICIPANTS_REACHED",
    "messages": {
      "error": "El grupo ha alcanzado o superaría el número máximo de participantes permitidos."
    }
  }
  ```

docs: |-
  # Registrar Firma de Contrato
  
  Registra la formalización física o digital del contrato consignando la fecha de firma y el enlace al documento escaneado/firmado.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/branches/{{branch_id}}/financing/groups/{{group_id}}/participants/{{participant_id}}/contract/sign`
  - **Método**: `PUT`
  - **Filtros**: `auth:scope=uri|3,module_code=fnc_contract_documents,only_user`
  - **Límite**: no aplica
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body
  
  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  file_url | string | Requerido. URL válida y estricta. Máx: 255. | Ubicación del documento PDF firmado y digitalizado en el almacenamiento.
  signed_date | string | Requerido. Fecha válida (YYYY-MM-DD). | Fecha en la cual el suscriptor estampó su firma.
  
  **Ejemplo:**
  ```JSON
  {
    "file_url": "https://storage.motcar.com/contracts/CNTR-01-261005-A1B2C3-signed.pdf",
    "signed_date": "2026-10-05"
  }
  ```
  
  ## ⚙️ Reglas de Negocio
  1. Si el contrato ya se encuentra en estado "Firmado" (`1`), la petición se rechaza con `409 CONTRACT_ALREADY_SIGNED`.
  2. Si el contrato está "Rescindido" (`2`), se rechaza con `409 CONTRACT_RESCINDED`.
  3. Al registrarse la firma satisfactoriamente, el estado de firma (`sign_status`) pasa de inmediato a `1`.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 1,
      "affected": true
    },
    "messages": {
      "success": "Registro actualizado exitosamente."
    }
  }
  ```
  
  **❌ 409 Contrato Ya Firmado**
  ```JSON
  {
    "status": 409,
    "error": "CONTRACT_ALREADY_SIGNED",
    "messages": {
      "error": "El contrato ya ha sido firmado previamente."
    }
  }
  ```
  
  **❌ 409 Contrato Rescindido**
  ```JSON
  {
    "status": 409,
    "error": "CONTRACT_RESCINDED",
    "messages": {
      "error": "El contrato se encuentra rescindido y no puede ser firmado."
    }
  }
  ```

http:
  method: GET
  url: "{{base_url}}/v1/branches/{{branch_id}}/financing/groups/{{group_id}}/participants/{{participant_id}}/contract/pdf"
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Descargar PDF de Contrato
  
  Genera y renderiza dinámicamente el documento del contrato en formato PDF con sus cláusulas legales, cronograma y datos del suscriptor.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/branches/{{branch_id}}/financing/groups/{{group_id}}/participants/{{participant_id}}/contract/pdf`
  - **Método**: `GET`
  - **Filtros**: `auth:scope=uri|3,module_code=fnc_contract_documents`
  - **Límite**: no aplica
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  No requiere parámetros en la petición. La sucursal, grupo y participante se transmiten en la URL.
  
  ## ⚙️ Reglas de Negocio
  1. Si el contrato no ha sido emitido, retorna `404 RECORD_NOT_FOUND`.
  2. El encabezado de respuesta incluye `Content-Type: application/pdf` y `Content-Disposition: inline; filename="{code}.pdf"`.
  3. El documento integra la plantilla HTML/PDF oficial compilada con la información vigente del suscriptor y del grupo SAM.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Stream Binario)**
  ```text
  HTTP/1.1 200 OK
  Content-Type: application/pdf
  Content-Disposition: inline; filename="CNTR-01-261005-A1B2C3.pdf"
  
  %PDF-1.7 ... (contenido binario del documento)
  ```
  
  **❌ 404 Registro No Encontrado**
  ```JSON
  {
    "status": 404,
    "error": "RECORD_NOT_FOUND",
    "messages": {
      "error": "El recurso solicitado no fue encontrado."
    }
  }
  ```

info:
  name: Consultar
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/branches/{{branch_id}}/financing/groups/{{group_id}}/participants/{{participant_id}}/contract"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const d = res.getBody()?.data;
          const id = Array.isArray(d) ? d[0]?.id : d?.id;
          if (id) bru.setEnvVar("contract_document_id", String(id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Consultar Contrato del Participante
  
  Recupera los datos del contrato formalizado o emitido para el participante del grupo SAM.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/branches/{{branch_id}}/financing/groups/{{group_id}}/participants/{{participant_id}}/contract`
  - **Método**: `GET`
  - **Filtros**: `auth:scope=uri|3,module_code=fnc_contract_documents`
  - **Límite**: no aplica
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  No requiere parámetros ni cuerpo adicional. La sucursal, el grupo y el participante se envían en la URL.
  
  ### Campos Disponibles
  
  Nombre | Nivel | Acciones | Descripción
  --- | --- | --- | ---
  id | 0 | L, F, O | ID del documento contractual.
  branch_id | 0 | L, F, O | Identificador de la sucursal.
  branch_name | 0 | L, F, O | Nombre de la sucursal (obtenido por relación).
  contract_type_id | 0 | L, F, O | Identificador del tipo de contrato.
  contract_type_code | 0 | L, F, O | Código del tipo de contrato (obtenido por relación).
  contract_type_name | 0 | L, F, O | Nombre de la modalidad contractual (obtenido por relación).
  origin_type | 0 | L, F, O | Tipo de origen ("0" = Participante SAM).
  origin_id | 0 | L, F, O | ID de inscripción del participante originador.
  code | 0 | L, F, O | Código correlativo oficial del contrato emitido.
  issue_date | 0 | L, F, O | Fecha y hora de emisión del contrato.
  signed_date | 0 | L, F, O | Fecha de consignación o firma física/digital.
  file_url | 0 | L, F, O | Enlace al archivo digitalizado del contrato firmado.
  sign_status | 0 | L, F, O | Estado de firma (0: Emitido/Sin firmar, 1: Firmado, 2: Rescindido).
  is_disabled | 0 | L, F, O | Estado (0: activo, 1: inhabilitado).
  created_at | 0 | L, F, O | Fecha de creación.
  updated_at | 0 | L, F, O | Fecha de modificación.
  deleted_at | 2 | L, F, O | Eliminación lógica (requiere nivel 2).
  
  > **Acciones:** `L`: Lectura (`fields`), `F`: Filtrado (`filters`), `O`: Ordenamiento (`order`), `G`: Agrupamiento (`groupBy`), `H`: Condición agregada (`having`).
  
  ## ⚙️ Reglas de Negocio
  1. La relación participante - contrato activo es 1:1. Retorna el contrato activo más reciente asociado al participante.
  2. Si el participante aún no posee contrato emitido, responde con `404 RECORD_NOT_FOUND`.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK**
  ```JSON
  {
    "data": {
      "id": "1",
      "branch_id": "1",
      "contract_type_id": "1",
      "contract_type_name": "Autofinanciamiento Colectivo SAM",
      "origin_type": "0",
      "origin_id": "1",
      "code": "CNTR-01-261005-A1B2C3",
      "issue_date": "2026-10-05 10:30:00",
      "signed_date": "2026-10-05",
      "file_url": "https://storage.motcar.com/contracts/CNTR-01-261005-A1B2C3.pdf",
      "sign_status": "1",
      "is_disabled": "0"
    },
    "in_trash": false
  }
  ```
  
  **❌ 404 Registro No Encontrado**
  ```JSON
  {
    "status": 404,
    "error": "RECORD_NOT_FOUND",
    "messages": {
      "error": "El recurso solicitado no fue encontrado."
    }
  }
  ```

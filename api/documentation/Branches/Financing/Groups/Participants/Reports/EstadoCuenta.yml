docs: |-
  # Estado de Cuenta (Cartola) del Participante

  Genera el balance individual y la cartola cronológica de cuotas y recibos aplicados a un suscriptor SAM, ideal para comprobantes de pago o envío de estado de cuenta vía WhatsApp.

  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/branches/{{branch_id}}/financing/groups/{{group_id}}/participants/{{participant_id}}/reports/statement`
  - **Método**: `GET`
  - **Filtros**: `auth:scope=uri|3,module_code=fnc_san_groups`
  - **Límite**: no aplica

  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.

  ## 📤 Datos de Solicitud (Request)
  No requiere cuerpo. La sucursal (`branch_id`), el grupo (`group_id`) y el participante (`participant_id`) se transmiten en la URL.

  ## ⚙️ Reglas de Negocio
  1. Consolida la ficha completa del participante con su posición, grupo, monto y cantidad de cuotas.
  2. Muestra a quien refirió al cliente (`referrer`) con su número telefónico.
  3. Resume las cifras globales: total comprometido, total recaudado, saldo deudor, cuotas pagadas vs pendientes y saldo en mora.
  4. Lista cronológicamente las cuotas pactadas, vinculando a cada cuota pagada su número de recibo oficial (`receipt_code`), fecha de cobro y cuenta receptora de fondos.


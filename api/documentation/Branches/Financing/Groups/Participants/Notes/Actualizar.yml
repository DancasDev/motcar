docs: |-
  # Actualizar Nota de Participante
  
  Modifica una o varias notas previamente registradas en la bitácora del participante.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/branches/{{branch_id}}/financing/groups/{{group_id}}/participants/{{participant_id}}/notes/{{participant_note_id}}` (Individual) o `{{base_url}}/v1/branches/{{branch_id}}/financing/groups/{{group_id}}/participants/{{participant_id}}/notes` (Masivo)
  - **Método**: `PUT`
  - **Filtros**: `auth:scope=uri|3,module_code=glb_notes,only_user`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body
  
  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  note_category_id | integer | Opcional. ID de categoría activa. | Nueva categoría de clasificación.
  content | string | Opcional. Texto no vacío. | Modificación del texto u observaciones.
  is_disabled | string | Opcional. Valores: "0", "1". | Estado (0: activo, 1: inhabilitado).
  
  **Ejemplo Individual:**
  ```JSON
  {
    "content": "Se contactó telefónicamente al participante. Acordó enviar comprobante por WhatsApp antes de las 3:00 PM."
  }
  ```
  
  **Ejemplo Masivo (vía `.../notes`, sin id en la URL):**
  ```JSON
  [
    {
      "id": 1,
      "content": "Nota 1 actualizada."
    },
    {
      "id": 2,
      "content": "Nota 2 actualizada."
    }
  ]
  ```
  
  ## ⚙️ Reglas de Negocio
  1. No es posible transferir notas a otro participante ni cambiar el autor original; cualquier campo `origin_id`, `origin_type` o `author_id` enviado en el cuerpo es descartado automáticamente.
  2. **Actualización parcial:** solo se modifican los campos enviados en el cuerpo de la petición.
  3. **Actualización masiva:** se habilita cuando no se envía identificador en la URL; cada objeto en el array debe incluir su `id`.
  4. Si la petición no incluye ningún campo modificable → `400 UPDATE_EMPTY_ITEM`.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Éxito Individual)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 1,
      "affected": true
    },
    "messages": {
      "success": "Registro actualizado exitosamente."
    }
  }
  ```
  
  **✅ 200 OK (Registro no afectado)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 999,
      "affected": false
    },
    "messages": {
      "success": "No se realizaron cambios porque los datos ya estaban actualizados."
    }
  }
  ```
  
  **✅ 207 Multi-Status (Éxito/Error Masivo)**
  ```JSON
  {
    "status": 207,
    "data": [
      {
        "status": 200,
        "data": {
          "id": 1,
          "affected": true
        },
        "messages": {
          "success": "Registro actualizado exitosamente."
        }
      },
      {
        "status": 400,
        "error": "FAIL_VALIDATION",
        "messages": {
          "note_category_id": "La categoría indicada no es válida."
        }
      }
    ],
    "limit": 100,
    "affected": 1
  }
  ```
  
  **❌ 400 Fail Validation**
  ```JSON
  {
    "status": 400,
    "error": "FAIL_VALIDATION",
    "messages": {
      "content": "El campo es obligatorio."
    }
  }
  ```

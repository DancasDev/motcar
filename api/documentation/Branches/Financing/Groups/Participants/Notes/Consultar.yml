info:
  name: Consultar
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/branches/{{branch_id}}/financing/groups/{{group_id}}/participants/{{participant_id}}/notes"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const d = res.getBody()?.data;
          const id = Array.isArray(d) ? d[0]?.id : d?.id;
          if (id) bru.setEnvVar("participant_note_id", String(id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Consultar Notas de Participante
  
  Recupera una nota individual o el historial cronológico y filtrado de notas registradas en la bitácora del participante.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/branches/{{branch_id}}/financing/groups/{{group_id}}/participants/{{participant_id}}/notes` (Lista) o `{{base_url}}/v1/branches/{{branch_id}}/financing/groups/{{group_id}}/participants/{{participant_id}}/notes/{{participant_note_id}}` (Individual)
  - **Método**: `GET`
  - **Filtros**: `auth:scope=uri|3,module_code=glb_notes`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Parámetros de Consulta (Query Params)
  Use la sintaxis del motor de consultas (ver documentación general): `fields`, `filters`, `order`, `page`, `itemsPerPage`, `groupBy`, `having`.
  
  ### Campos Disponibles
  
  Nombre | Nivel | Acciones | Descripción
  --- | --- | --- | ---
  id | 0 | L, F, O | ID del registro de nota.
  note_category_id | 0 | L, F, O | Identificador de la categoría.
  category_name | 0 | L, F, O | Nombre de la categoría (obtenido por relación).
  category_color | 0 | L, F, O | Color distintivo de la categoría (obtenido por relación).
  author_id | 0 | L, F, O | Identificador del usuario autor de la nota.
  author_first_name | 0 | L, F, O | Nombre del usuario autor (obtenido por relación).
  author_last_name | 0 | L, F, O | Apellido del usuario autor (obtenido por relación).
  origin_type | 0 | L, F, O | Tipo de entidad origen ("0" = Participante SAM).
  origin_id | 0 | L, F, O | Identificador del participante asociado.
  content | 0 | L, F, O | Texto descriptivo de la nota.
  is_disabled | 0 | L, F, O | Estado (0: activo, 1: inhabilitado).
  created_at | 0 | L, F, O | Fecha y hora de registro.
  updated_at | 0 | L, F, O | Fecha de modificación.
  deleted_at | 2 | L, F, O | Eliminación lógica (requiere nivel 2).
  
  > **Acciones:** `L`: Lectura (`fields`), `F`: Filtrado (`filters`), `O`: Ordenamiento (`order`), `G`: Agrupamiento (`groupBy`), `H`: Condición agregada (`having`).
  
  ## ⚙️ Reglas de Negocio
  1. La consulta restringe automáticamente los registros a las notas originadas por el participante especificado en `{{participant_id}}`.
  2. Los datos de categoría y del usuario autor se obtienen automáticamente mediante relaciones internas del motor de consulta.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Listado)**
  ```JSON
  {
    "data": [
      {
        "id": "1",
        "note_category_id": "1",
        "category_name": "Compromiso de Pago",
        "category_color": "#2ECC71",
        "author_id": "1",
        "author_first_name": "Daniel",
        "author_last_name": "Castillo",
        "content": "Se contactó al participante. Prometió cancelar el viernes.",
        "created_at": "2026-10-05 11:00:00",
        "is_disabled": "0"
      }
    ],
    "count": 1,
    "limit": 25,
    "in_trash": false
  }
  ```
  
  **✅ 200 OK (Individual)**
  ```JSON
  {
    "data": {
      "id": "1",
      "note_category_id": "1",
      "category_name": "Compromiso de Pago",
      "category_color": "#2ECC71",
      "author_id": "1",
      "author_first_name": "Daniel",
      "author_last_name": "Castillo",
      "content": "Se contactó al participante. Prometió cancelar el viernes.",
      "created_at": "2026-10-05 11:00:00",
      "is_disabled": "0"
    },
    "in_trash": false
  }
  ```
  
  **❌ 404 Registro No Encontrado**
  ```JSON
  {
    "status": 404,
    "error": "RECORD_NOT_FOUND",
    "messages": {
      "error": "El recurso solicitado no fue encontrado."
    }
  }
  ```

info:
  name: Consultar
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/branches/{{branch_id}}/financing/groups"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const d = res.getBody()?.data;
          const id = Array.isArray(d) ? d[0]?.id : d?.id;
          if (id) bru.setEnvVar("group_id", String(id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Consultar Grupo SAM
  
  Recupera un grupo de ahorro colectivo individual o un listado paginado y filtrado de grupos pertenecientes a la sucursal.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/branches/{{branch_id}}/financing/groups` (Lista) o `{{base_url}}/v1/branches/{{branch_id}}/financing/groups/{{group_id}}` (Individual)
  - **Método**: `GET`
  - **Filtros**: `auth:scope=uri|3,module_code=fnc_san_groups`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Parámetros de Consulta (Query Params)
  Use la sintaxis del motor de consultas (ver documentación general): `fields`, `filters`, `order`, `page`, `itemsPerPage`, `groupBy`, `having`.
  
  ### Campos Disponibles
  
  Nombre | Nivel | Acciones | Descripción
  --- | --- | --- | ---
  id | 0 | L, F, O | ID del grupo SAM.
  branch_id | 0 | L, F, O | Identificador de la sucursal.
  branch_name | 0 | L, F, O | Nombre de la sucursal (obtenido por relación).
  frequency_id | 0 | L, F, O | Identificador de la frecuencia de cuota.
  frequency_code | 0 | L, F, O | Código de la frecuencia (obtenido por relación).
  frequency_name | 0 | L, F, O | Nombre de la frecuencia (obtenido por relación).
  contract_type_id | 0 | L, F, O | Identificador del tipo de contrato.
  contract_type_code | 0 | L, F, O | Código del tipo de contrato (obtenido por relación).
  contract_type_name | 0 | L, F, O | Nombre del tipo de contrato (obtenido por relación).
  name | 0 | L, F, O | Nombre descriptivo del grupo SAM.
  installment_amount | 0 | L, F, O | Valor fijado por cada cuota.
  installment_count | 0 | L, F, O | Cantidad total de cuotas periódicas.
  participant_max | 0 | L, F, O | Cupos máximos de participantes.
  participant_count | 0 | L, F, O | Cantidad de participantes inscritos.
  frequency_base_date | 0 | L, F, O | Fecha base de vencimientos de cuotas.
  status | 0 | L, F, O | Estado operativo (0: Formación, 1: Activo, 2: Cerrado).
  is_disabled | 0 | L, F, O | Estado (0: activo, 1: inhabilitado).
  created_at | 0 | L, F, O | Fecha de creación.
  updated_at | 0 | L, F, O | Fecha de modificación.
  deleted_at | 2 | L, F, O | Eliminación lógica (requiere nivel 2).
  
  > **Acciones:** `L`: Lectura (`fields`), `F`: Filtrado (`filters`), `O`: Ordenamiento (`order`), `G`: Agrupamiento (`groupBy`), `H`: Condición agregada (`having`).
  
  ## ⚙️ Reglas de Negocio
  1. La consulta restringe los grupos de forma estricta a los administrados por la sucursal indicada en `{{branch_id}}`.
  2. Los datos enriquecidos de sucursal, frecuencia y tipo de contrato son incorporados dinámicamente mediante el motor de consultas.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Listado)**
  ```JSON
  {
    "data": [
      {
        "id": "1",
        "branch_id": "1",
        "name": "GRUPO SAM EK-EXPRESS #01",
        "installment_amount": "50.00",
        "installment_count": "24",
        "participant_max": "24",
        "participant_count": "18",
        "status": "0",
        "is_disabled": "0"
      }
    ],
    "count": 1,
    "limit": 25,
    "in_trash": false
  }
  ```
  
  **✅ 200 OK (Individual)**
  ```JSON
  {
    "data": {
      "id": "1",
      "branch_id": "1",
      "name": "GRUPO SAM EK-EXPRESS #01",
      "installment_amount": "50.00",
      "installment_count": "24",
      "participant_max": "24",
      "participant_count": "18",
      "status": "0",
      "is_disabled": "0"
    },
    "in_trash": false
  }
  ```
  
  **❌ 404 Registro No Encontrado**
  ```JSON
  {
    "status": 404,
    "error": "RECORD_NOT_FOUND",
    "messages": {
      "error": "El recurso solicitado no fue encontrado."
    }
  }
  ```

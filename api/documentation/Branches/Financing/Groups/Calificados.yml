http:
  method: GET
  url: "{{base_url}}/v1/branches/{{branch_id}}/financing/groups/{{group_id}}/qualified-participants"
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Consultar Participantes Calificados para Adjudicación
  
  Retorna la nómina de suscriptores del grupo SAM que califican para participar en el acto de adjudicación o sorteo mensual (activos, al día sin cuotas vencidas y aún no adjudicados).
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/branches/{{branch_id}}/financing/groups/{{group_id}}/qualified-participants`
  - **Método**: `GET`
  - **Filtros**: `auth:scope=uri|3,module_code=fnc_san_groups`
  - **Límite**: no aplica
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  No requiere parámetros ni cuerpo adicional. La sucursal y el grupo se transmiten en la URL.
  
  ## ⚙️ Reglas de Negocio
  1. Ejecuta previamente una sincronización automática de morosidad (`syncOverdue`) en la sucursal para garantizar exactitud en la evaluación del estado de pago.
  2. Los criterios de calificación son estrictos:
     - `status = 1` (activo en el grupo).
     - `is_overdue = 0` (solvente, sin cuotas vencidas impagas).
     - `awarded_at IS NULL` (no haber sido adjudicado previamente).
  3. Los resultados se entregan ordenados ascendentemente por la posición (`position`) del participante en el grupo.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK**
  ```JSON
  {
    "status": 200,
    "data": [
      {
        "id": 1,
        "position": 1,
        "status": "1",
        "is_overdue": "0",
        "awarded_at": null,
        "first_name": "Carlos",
        "last_name": "Pérez",
        "identification_type": "V",
        "identification_value": "18234567"
      },
      {
        "id": 5,
        "position": 3,
        "status": "1",
        "is_overdue": "0",
        "awarded_at": null,
        "first_name": "María",
        "last_name": "González",
        "identification_type": "V",
        "identification_value": "20123456"
      }
    ],
    "count": 2
  }
  ```

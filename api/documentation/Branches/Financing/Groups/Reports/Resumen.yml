http:
  method: GET
  url: "{{base_url}}/v1/branches/{{branch_id}}/financing/groups/{{group_id}}/reports/summary"
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Resumen Financiero y Matriz del Grupo SAM

  Retorna el balance financiero consolidado (compromiso total, monto recaudado, saldo por cobrar y porcentaje de avance) junto con la matriz operativa de participantes del grupo SAM.

  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/branches/{{branch_id}}/financing/groups/{{group_id}}/reports/summary`
  - **Método**: `GET`
  - **Filtros**: `auth:scope=uri|3,module_code=fnc_san_groups`
  - **Límite**: no aplica

  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.

  ## 📤 Datos de Solicitud (Request)
  No requiere cuerpo. La sucursal (`branch_id`) y el grupo (`group_id`) se transmiten en la URL.

  ## ⚙️ Reglas de Negocio
  1. El compromiso total del grupo se calcula sumando los compromisos individuales de cada participante (`installment_count * installment_amount`), soportando grupos de cualquier tamaño y cuotas personalizadas.
  2. El monto recaudado refleja los pagos reales asentados en la cartera (`acc_receivable`) y los recibos de apertura vinculados.
  3. Desglosa cada posición con los datos del cliente, contacto de referencia (quien lo refirió con $15), cuotas pagadas/pendientes y vehículo asignado en caso de adjudicación.


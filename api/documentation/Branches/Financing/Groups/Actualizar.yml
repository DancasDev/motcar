docs: |-
  # Actualizar Grupo SAM
  
  Modifica uno o varios grupos SAM administrados por la sucursal.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/branches/{{branch_id}}/financing/groups/{{group_id}}` (Individual) o `{{base_url}}/v1/branches/{{branch_id}}/financing/groups` (Masivo)
  - **Método**: `PUT`
  - **Filtros**: `auth:scope=uri|3,module_code=fnc_san_groups,only_user`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body
  
  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  frequency_id | integer | Opcional. ID de frecuencia activa. | Periodicidad de pago.
  contract_type_id | integer | Opcional. ID de tipo de contrato activo. | Modalidad legal del contrato.
  name | string | Opcional. Máx: 40. Único. | Nombre identificador del grupo.
  amount | decimal | Opcional. Mayor a 0. | Monto total nominal de adjudicación.
  installment_amount | decimal | Opcional. Mayor a 0. | Monto fijado por cuota.
  installment_count | integer | Opcional. Entre 1 y 99. | Total de cuotas.
  participant_max | integer | Opcional. Entre 1 y 255. | Capacidad máxima de participantes.
  frequency_base_date | string | Opcional. Formato YYYY-MM-DD. | Fecha base para vencimientos.
  status | string | Opcional. Valores: "0" (Formación), "1" (Activo), "2" (Cerrado). | Estado operativo del grupo.
  is_disabled | string | Opcional. Valores: "0", "1". | Estado (0: activo, 1: inhabilitado).
  
  **Ejemplo Individual:**
  ```JSON
  {
    "status": "1",
    "participant_max": 24
  }
  ```
  
  **Ejemplo Masivo (vía `.../financing/groups`, sin id en la URL):**
  ```JSON
  [
    {
      "id": 1,
      "status": "1"
    },
    {
      "id": 2,
      "status": "1"
    }
  ]
  ```
  
  ## ⚙️ Reglas de Negocio
  1. La modificación está estrictamente delimitada al alcance de la sucursal indicada en `{{branch_id}}`.
  2. Si se altera el nombre del grupo, se valida que mantenga unicidad en el sistema.
  3. **Actualización parcial:** solo se modifican los campos enviados en el cuerpo de la petición.
  4. **Actualización masiva:** se habilita cuando no se envía identificador en la URL; cada objeto en el array debe incluir su `id`.
  5. Si la petición no incluye ningún campo modificable → `400 UPDATE_EMPTY_ITEM`.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Éxito Individual)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 1,
      "affected": true
    },
    "messages": {
      "success": "Registro actualizado exitosamente."
    }
  }
  ```
  
  **✅ 200 OK (Registro no afectado)**
  ```JSON
  {
    "status": 200,
    "data": {
      "id": 999,
      "affected": false
    },
    "messages": {
      "success": "No se realizaron cambios porque los datos ya estaban actualizados."
    }
  }
  ```
  
  **✅ 207 Multi-Status (Éxito/Error Masivo)**
  ```JSON
  {
    "status": 207,
    "data": [
      {
        "status": 200,
        "data": {
          "id": 1,
          "affected": true
        },
        "messages": {
          "success": "Registro actualizado exitosamente."
        }
      },
      {
        "status": 400,
        "error": "FAIL_VALIDATION",
        "messages": {
          "name": "El campo debe contener un valor único."
        }
      }
    ],
    "limit": 100,
    "affected": 1
  }
  ```
  
  **❌ 400 Fail Validation**
  ```JSON
  {
    "status": 400,
    "error": "FAIL_VALIDATION",
    "messages": {
      "status": "El estado indicado no es válido."
    }
  }
  ```

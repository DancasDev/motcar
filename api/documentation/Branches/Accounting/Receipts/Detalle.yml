docs: |-
  # Consultar Detalle Consolidado del Recibo
  
  Obtiene la estructura completa y consolidada del recibo de cobro, incluyendo datos de la cabecera, cliente, cajero, renglones de cuentas por cobrar imputadas (`items`), medios de pago (`payments`), saldos a favor generados (`credits`) y balance financiero total expresado en USD.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/branches/{{branch_id}}/accounting/receipts/{{receipt_id}}/detail`
  - **Método**: `GET`
  - **Filtros**: `auth:scope=uri|3,module_code=acc_receipts`
  - **Límite**: no aplica (estructura fija consolidada)
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## ⚙️ Reglas de Negocio y Rendimiento
  1. **Caché de Alto Rendimiento:** La respuesta es almacenada en memoria caché durante 5 minutos (`300` segundos) bajo la clave `acc_receipt_detail_{branch_id}_{receipt_id}` para evitar impacto en base de datos.
  2. **Invalidación Automática:** Cualquier cambio en la cabecera, renglones, pagos o confirmación/anulación del estado invalida automáticamente la caché.
  3. **Protección Anti-Stampede:** Si el recibo no existe en la sucursal, se cachea una respuesta vacía temporal para proteger el servidor frente a consultas abusivas.
  4. **Cálculo de Totales Multidivisa:** Todos los pagos y créditos registrados en monedas secundarias son convertidos automáticamente a USD usando la tasa de cambio (`exchange_rate`) capturada al momento del registro.
  

info:
  name: Restaurar
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{base_url}}/v1/branches/{{branch_id}}/accounting/receipts/{{receipt_id}}/items/{{receipt_item_id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Restaurar Renglón de Recibo
  
  Restaura un renglón previamente eliminado de un recibo que permanezca en estado borrador.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/branches/{{branch_id}}/accounting/receipts/{{receipt_id}}/items/{{receipt_item_id}}` (Individual) o `{{base_url}}/v1/branches/{{branch_id}}/accounting/receipts/{{receipt_id}}/items` (Masivo)
  - **Método**: `PATCH`
  - **Filtros**: `auth:scope=uri|3,module_code=acc_receipts,only_user`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body (Solo Masivo)
  
  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  id | integer | Requerido en masivo. | Identificador del renglón a restaurar.
  
  **Ejemplo Masivo (vía `.../items`):**
  ```JSON
  [
    {
      "id": 1
    },
    {
      "id": 2
    }
  ]
  ```
  
  ## ⚙️ Reglas de Negocio
  1. **Estado Borrador Requerido:** Solo se permite restaurar cuentas por cobrar si el recibo padre se encuentra en estado Borrador (`status = "0"`). De lo contrario, retorna `409 RECEIPT_NOT_DRAFT`.
  2. Al restaurarse, la cuenta por cobrar vuelve a formar parte de la prelación de amortización FIFO para la confirmación del recibo.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Restauración Exitosa Individual)**
  ```JSON
  {
    "status": 200,
    "affected": 1
  }
  ```
  
  **⚠️ 207 Multi-Status (Restauración Masiva Mixta)**
  ```JSON
  {
    "status": 207,
    "total": 2,
    "data": [
      {
        "status": 200,
        "affected": 1
      },
      {
        "status": 404,
        "error": "ROW_NOT_FOUND",
        "message": "Registro no encontrado en la papelera del recibo."
      }
    ]
  }
  ```
  
  **❌ 404 Not Found (Recibo o Renglón no encontrado)**
  ```JSON
  {
    "status": 404,
    "error": "RECEIPT_NOT_FOUND",
    "message": "El recibo especificado no existe o no pertenece a la sucursal indicada."
  }
  ```
  
  **❌ 409 Conflict (Recibo no es borrador)**
  ```JSON
  {
    "status": 409,
    "error": "RECEIPT_NOT_DRAFT",
    "message": "Solo es posible modificar recibos en estado borrador."
  }
  ```

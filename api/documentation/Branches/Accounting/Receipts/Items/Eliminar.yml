docs: |-
  # Eliminar Renglón de Recibo
  
  Elimina de forma suave (soft delete) una obligación vinculada a un recibo en estado borrador.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/branches/{{branch_id}}/accounting/receipts/{{receipt_id}}/items/{{receipt_item_id}}` (Individual) o `{{base_url}}/v1/branches/{{branch_id}}/accounting/receipts/{{receipt_id}}/items` (Masivo)
  - **Método**: `DELETE`
  - **Filtros**: `auth:scope=uri|3,module_code=acc_receipts,only_user`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body (Solo Masivo)
  
  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  id | integer | Requerido en masivo. | Identificador del renglón a eliminar.
  
  **Ejemplo Masivo (vía `.../items`):**
  ```JSON
  [
    {
      "id": 1
    },
    {
      "id": 2
    }
  ]
  ```
  
  ## ⚙️ Reglas de Negocio
  1. **Estado Borrador Requerido:** Solo se permite desvincular cuentas por cobrar si el recibo padre se encuentra en estado Borrador (`status = "0"`). Si ya fue confirmado o anulado, retorna `409 RECEIPT_NOT_DRAFT`.
  2. La eliminación suave no elimina la cuenta por cobrar subyacente, únicamente la remueve de la lista de imputación del recibo.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Eliminación Exitosa Individual)**
  ```JSON
  {
    "status": 200,
    "affected": 1
  }
  ```
  
  **⚠️ 207 Multi-Status (Eliminación Masiva Mixta)**
  ```JSON
  {
    "status": 207,
    "total": 2,
    "data": [
      {
        "status": 200,
        "affected": 1
      },
      {
        "status": 404,
        "error": "ROW_NOT_FOUND",
        "message": "Registro no encontrado en el recibo."
      }
    ]
  }
  ```
  
  **❌ 404 Not Found (Recibo o Renglón no encontrado)**
  ```JSON
  {
    "status": 404,
    "error": "RECEIPT_NOT_FOUND",
    "message": "El recibo especificado no existe o no pertenece a la sucursal indicada."
  }
  ```
  
  **❌ 409 Conflict (Recibo no es borrador)**
  ```JSON
  {
    "status": 409,
    "error": "RECEIPT_NOT_DRAFT",
    "message": "Solo es posible modificar recibos en estado borrador."
  }
  ```

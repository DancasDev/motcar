docs: |-
  # Actualizar Medio de Pago de Recibo
  
  Modifica un medio de pago previamente registrado en un recibo en estado borrador, recalculando automáticamente la tasa de cambio y el equivalente en dólares.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/branches/{{branch_id}}/accounting/receipts/{{receipt_id}}/payments/{{receipt_payment_id}}` (Individual) o `{{base_url}}/v1/branches/{{branch_id}}/accounting/receipts/{{receipt_id}}/payments` (Masivo)
  - **Método**: `PUT`
  - **Filtros**: `auth:scope=uri|3,module_code=acc_receipts,only_user`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body
  
  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  id | integer | Requerido en masivo. | Identificador del registro de pago a modificar.
  origin_type | string | Opcional. In: `["0", "1"]`. | Tipo de origen: `"0"` (Cuenta bancaria) o `"1"` (Saldo a favor).
  origin_id | integer | Opcional. Clave foránea válida. | ID de la cuenta bancaria o del saldo a favor.
  amount | number | Opcional. Decimal estricto > 0. | Nuevo importe del pago.
  payment_date | string | Opcional. Formato YYYY-MM-DD. | Fecha del pago para lookup de tasa.
  reference | string | Opcional. Máx 60 car. | Número de referencia bancaria.
  file_url | string | Opcional. URL válida. | Enlace al comprobante digital.
  notes | string | Opcional. Máx 255 car. | Observaciones del pago.
  
  **Ejemplo Individual:**
  ```JSON
  {
    "amount": 90.0,
    "reference": "REF-TRF-987654-B"
  }
  ```
  
  **Ejemplo Masivo (vía `.../payments`):**
  ```JSON
  [
    {
      "id": 1,
      "amount": 40.0
    },
    {
      "id": 2,
      "amount": 50.0
    }
  ]
  ```
  
  ## ⚙️ Reglas de Negocio
  1. **Estado Borrador Requerido:** Solo se permite modificar pagos si el recibo padre se encuentra en estado Borrador (`status = "0"`). De lo contrario, se deniega con `409 RECEIPT_NOT_DRAFT`.
  2. **Recálculo Automático:** Si se altera el monto, origen o fecha, el servidor reevalúa la tasa de cambio y recalcula `amount_usd`.
  3. Si el pago corresponde a un saldo a favor (`origin_type = 1`), valida que el nuevo monto no exceda el disponible en el crédito del cliente.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Actualización Exitosa Individual)**
  ```JSON
  {
    "status": 200,
    "affected": 1
  }
  ```
  
  **⚠️ 207 Multi-Status (Actualización Masiva Mixta)**
  ```JSON
  {
    "status": 207,
    "total": 2,
    "data": [
      {
        "status": 200,
        "affected": 1
      },
      {
        "status": 400,
        "error": "CREDIT_INSUFFICIENT_BALANCE",
        "messages": {
          "amount": "El importe excede el saldo a favor disponible para el cliente."
        }
      }
    ]
  }
  ```
  
  **❌ 404 Not Found (Recibo o Pago no encontrado)**
  ```JSON
  {
    "status": 404,
    "error": "RECEIPT_NOT_FOUND",
    "message": "El recibo especificado no existe o no pertenece a la sucursal indicada."
  }
  ```
  
  **❌ 409 Conflict (Recibo no es borrador)**
  ```JSON
  {
    "status": 409,
    "error": "RECEIPT_NOT_DRAFT",
    "message": "Solo es posible modificar recibos en estado borrador."
  }
  ```

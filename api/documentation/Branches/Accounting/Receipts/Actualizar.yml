docs: |-
  # Actualizar Recibo de Cobro
  
  Modifica las observaciones o notas de un recibo de cobro existente en estado borrador.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/branches/{{branch_id}}/accounting/receipts/{{receipt_id}}`
  - **Método**: `PUT`
  - **Filtros**: `auth:scope=uri|3,module_code=acc_receipts,only_user`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body
  
  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  notes | string | Opcional. Texto libre. | Nuevas observaciones o notas del comprobante.
  
  **Ejemplo:**
  ```JSON
  {
    "notes": "Observaciones actualizadas previas a la confirmación del pago."
  }
  ```
  
  ## ⚙️ Reglas de Negocio
  1. **Exclusividad en Borrador:** Solo se permite modificar recibos en estado Borrador (`status = 0`). Si el recibo ya fue Confirmado (`1`) o Anulado (`2`), el servidor rechazará la petición con un error `409 RECEIPT_NOT_DRAFT`.
  2. **Inmutabilidad de datos contables:** El cliente titular (`client_id`), la sucursal (`branch_id`), el recaudador (`collector_id`), la fecha y el código no pueden alterarse mediante este endpoint.
  3. La actualización exitosa invalida de inmediato la memoria caché consolidada del recibo.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Actualización Exitosa)**
  ```JSON
  {
    "status": 200,
    "affected": 1
  }
  ```
  
  **❌ 404 Not Found (Recibo no encontrado)**
  ```JSON
  {
    "status": 404,
    "error": "RECEIPT_NOT_FOUND",
    "message": "El recibo especificado no existe o no pertenece a la sucursal indicada."
  }
  ```
  
  **❌ 409 Conflict (Recibo no es borrador)**
  ```JSON
  {
    "status": 409,
    "error": "RECEIPT_NOT_DRAFT",
    "message": "Solo es posible modificar recibos en estado borrador."
  }
  ```

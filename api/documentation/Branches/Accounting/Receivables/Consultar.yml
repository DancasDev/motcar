info:
  name: Consultar
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/branches/{{branch_id}}/accounting/receivables"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const d = res.getBody()?.data;
          const id = Array.isArray(d) ? d[0]?.id : d?.id;
          if (id) bru.setEnvVar("receivable_id", String(id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Consultar Cuenta por Cobrar
  
  Recupera una cuenta por cobrar individual o un listado paginado y filtrado de la cartera de cobros de la sucursal.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/branches/{{branch_id}}/accounting/receivables` (Lista) o `{{base_url}}/v1/branches/{{branch_id}}/accounting/receivables/{{receivable_id}}` (Individual)
  - **Método**: `GET`
  - **Filtros**: `auth:scope=uri|3,module_code=acc_receivables`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Parámetros de Consulta (Query Params)
  Use la sintaxis del motor de consultas (ver documentación general): `fields`, `filters`, `order`, `page`, `itemsPerPage`, `groupBy`, `having`.
  
  ### Campos Disponibles
  
  Nombre | Nivel | Acciones | Descripción
  --- | --- | --- | ---
  id | 0 | L, F, O | ID de la cuenta por cobrar.
  branch_id | 0 | L, F, O | Identificador de la sucursal.
  branch_name | 0 | L, F, O | Nombre de la sucursal (obtenido por relación).
  client_id | 0 | L, F, O | Identificador del cliente.
  client_first_name | 0 | L, F, O | Nombre del cliente (obtenido por relación).
  client_last_name | 0 | L, F, O | Apellido del cliente (obtenido por relación).
  receivable_concept_id | 0 | L, F, O | Identificador del concepto de cobro.
  concept_code | 0 | L, F, O | Código del concepto (obtenido por relación).
  concept_name | 0 | L, F, O | Nombre descriptivo del concepto (obtenido por relación).
  description | 0 | L, F, O | Glosa o descripción de la obligación.
  origin_type | 0 | L, F, O | Tipo de origen ("0" = Participante SAM).
  origin_id | 0 | L, F, O | Identificador del registro originador.
  total_amount | 0 | L, F, O | Monto nominal total exigible.
  paid_amount | 0 | L, F, O | Monto acumulado ya cobrado/amortizado.
  issue_date | 0 | L, F, O | Fecha de emisión.
  due_date | 0 | L, F, O | Fecha límite de vencimiento.
  status | 0 | L, F, O | Estado (0: Pendiente, 1: Abonado, 2: Pagado, 3: Anulado).
  is_disabled | 0 | L, F, O | Estado (0: activo, 1: inhabilitado).
  created_at | 0 | L, F, O | Fecha de creación.
  updated_at | 0 | L, F, O | Fecha de modificación.
  deleted_at | 2 | L, F, O | Eliminación lógica (requiere nivel 2).
  
  > **Acciones:** `L`: Lectura (`fields`), `F`: Filtrado (`filters`), `O`: Ordenamiento (`order`), `G`: Agrupamiento (`groupBy`), `H`: Condición agregada (`having`).
  
  ## ⚙️ Reglas de Negocio
  1. La consulta restringe los registros a la cartera de cuentas por cobrar de la sucursal indicada en `{{branch_id}}`.
  2. Los datos vinculados de cliente, sucursal y concepto de cobro se incorporan automáticamente mediante el motor de consultas.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Listado)**
  ```JSON
  {
    "data": [
      {
        "id": "1",
        "branch_id": "1",
        "client_id": "1",
        "client_first_name": "Carlos",
        "client_last_name": "Pérez",
        "receivable_concept_id": "1",
        "concept_name": "Cuota Periódica SAM",
        "description": "Cuota #01 de 24 - GRUPO SAM EK-EXPRESS #01",
        "total_amount": "50.00",
        "paid_amount": "0.00",
        "due_date": "2026-10-15",
        "status": "0",
        "is_disabled": "0"
      }
    ],
    "count": 1,
    "limit": 25,
    "in_trash": false
  }
  ```
  
  **✅ 200 OK (Individual)**
  ```JSON
  {
    "data": {
      "id": "1",
      "branch_id": "1",
      "client_id": "1",
      "client_first_name": "Carlos",
      "client_last_name": "Pérez",
      "receivable_concept_id": "1",
      "concept_name": "Cuota Periódica SAM",
      "description": "Cuota #01 de 24 - GRUPO SAM EK-EXPRESS #01",
      "total_amount": "50.00",
      "paid_amount": "0.00",
      "due_date": "2026-10-15",
      "status": "0",
      "is_disabled": "0"
    },
    "in_trash": false
  }
  ```
  
  **❌ 404 Registro No Encontrado**
  ```JSON
  {
    "status": 404,
    "error": "RECORD_NOT_FOUND",
    "messages": {
      "error": "El recurso solicitado no fue encontrado."
    }
  }
  ```

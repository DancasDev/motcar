info:
  name: Consultar
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/v1/branches"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const d = res.getBody()?.data;
          const id = Array.isArray(d) ? d[0]?.id : d?.id;
          if (id) bru.setEnvVar("branch_id", String(id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Consultar Sucursal
  
  Recupera una sucursal individual o un listado paginado y filtrado. Usa el motor de consultas.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/branches` (Lista) o `{{base_url}}/v1/branches/{{branch_id}}` (Individual)
  - **Método**: `GET`
  - **Filtros**: `auth:module_code=cmp_branches`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Parámetros de Consulta (Query Params)
  Use la sintaxis del motor de consultas (ver documentación general): `fields`, `filters`, `order`, `page`, `itemsPerPage`, `groupBy`, `having`.
  
  
  ### Campos Disponibles

  Nombre | Nivel | Acciones | Descripción
  --- | --- | --- | ---
  id | 0 | L, F, O | ID del registro.
  parent_id | 0 | L, F, O | Sucursal padre.
  parent_name | 0 | L, F, O | Nombre de la sucursal padre.
  name | 0 | L, F, O | Nombre de la sucursal.
  is_disabled | 0 | L, F, O | Estado.
  created_at | 0 | L, F, O | Fecha de creación.
  updated_at | 0 | L, F, O | Fecha de modificación.
  deleted_at | 2 | L, F, O | Eliminación lógica (requiere nivel 2).
  
  > **Acciones:** `L`: Lectura (`fields`), `F`: Filtrado (`filters`), `O`: Ordenamiento (`order`), `G`: Agrupamiento (`groupBy`), `H`: Condición agregada (`having`).
  
  > Para el **mapa completo del árbol** (breadcrumbs, conteos y herencia) use el endpoint `Arbol` (`GET /v1/branches/tree`).
  
  ## ⚙️ Reglas de Negocio
  1. `parent_id = null` indica una sucursal **raíz**.
  2. Para obtener la estructura completa del árbol jerárquico con rutas y contadores anidados, utilice el endpoint `GET /v1/branches/tree`.
  
  ## 📥 Respuestas (Responses)
  
  **✅ 200 OK (Listado)**
  ```JSON
  {
    "data": [
      {
        "id": 1,
        "parent_id": null,
        "name": "Sede Central"
      }
    ],
    "count": 1,
    "limit": 25,
    "in_trash": false
  }
  ```
  
  **✅ 200 OK (Individual)**
  ```JSON
  {
    "data": {
      "id": 1,
      "parent_id": null,
      "name": "Sede Central"
    },
    "in_trash": false
  }
  ```
  
  **❌ 404 Registro No Encontrado**
  ```JSON
  {
    "status": 404,
    "error": "RECORD_NOT_FOUND",
    "messages": {
      "error": "El recurso solicitado no fue encontrado."
    }
  }
  ```

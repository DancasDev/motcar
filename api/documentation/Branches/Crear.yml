info:
  name: Crear
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/v1/branches"
  body:
    type: json
    data: |-
      {
        "name": "Sucursal Norte",
        "parent_id": 1,
        "is_disabled": "0"
      }

  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if ([201, 207].includes(res.getStatus())) {
          const d = res.getBody()?.data;
          const id = Array.isArray(d) ? d.find(i => i?.status === 201)?.data?.id : d?.id;
          if (id) bru.setEnvVar("branch_id", String(id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Crear Sucursal
  
  Registra una nueva sucursal en el árbol jerárquico de la empresa.
  
  ## 📝 Definición
  - **URL**: `{{base_url}}/v1/branches`
  - **Método**: `POST`
  - **Filtros**: `auth:module_code=cmp_branches,only_user`
  - **Límite**: por defecto
  
  > **Nota:** autenticación, encabezados estándar, formato de respuesta, fechas en UTC y errores comunes se documentan en la **documentación general** de la colección. Aquí solo lo específico del recurso.
  
  ## 📤 Datos de Solicitud (Request)
  
  ### Body
  
  Campo | Tipo | Reglas | Descripción
  --- | --- | --- | ---
  name | string | Requerido. Máx: 30. Único por rama (parent_id + name). | Nombre de la sucursal.
  parent_id | integer | Opcional. Debe existir, estar activa y no ser un descendiente. `null` = raíz. | Sucursal padre (jerarquía).
  is_disabled | string | Opcional. Valores: "0", "1". | Estado (0: activo, 1: inhabilitado).
  
  **Ejemplo Individual:**
  ```JSON
  {
    "name": "Sucursal Norte",
    "parent_id": 1,
    "is_disabled": "0"
  }
  ```
  
  **Ejemplo Masivo (vía `/v1/branches?is_batch=true`):**
  ```JSON
  [
    {
      "name": "Sucursal Norte",
      "parent_id": 1
    },
    {
      "name": "Almacén",
      "parent_id": 1
    }
  ]
  ```
  
  ## ⚙️ Reglas de Negocio
  1. `parent_id` vacío/ausente crea una **raíz** (`parent_id = null`).
  2. El árbol se valida: `parent_id` no puede ser la propia sucursal ni un descendiente (ciclo) y debe existir activa; en caso contrario → `400 FAIL_VALIDATION`.
  3. `name` debe ser **único entre hermanas** (clave compuesta `parent_id + name`).

  
  ## 📥 Respuestas (Responses)
  
  **✅ 201 Created (Éxito Individual)**
  ```JSON
  {
    "status": 201,
    "data": {
      "id": 10
    },
    "messages": {
      "success": "Registro creado exitosamente."
    }
  }
  ```
  
  **✅ 207 Multi-Status (Éxito/Error Masivo)**
  ```JSON
  {
    "status": 207,
    "data": [
      {
        "status": 201,
        "data": {
          "id": 10
        },
        "messages": {
          "success": "Registro creado exitosamente."
        }
      },
      {
        "status": 400,
        "error": "FAIL_VALIDATION",
        "messages": {
          "name": "El campo es obligatorio."
        }
      }
    ],
    "limit": 100,
    "affected": 1
  }
  ```
  
  **❌ 400 Fail Validation**
  ```JSON
  {
    "status": 400,
    "error": "FAIL_VALIDATION",
    "messages": {
      "parent_id": "La sucursal padre no existe o no está disponible."
    }
  }
  ```
